  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    overflow: hidden;
    font-family: "Rany Display", "PingFang SC", Inter, ui-sans-serif, system-ui, sans-serif;
  }

  .stage { position: fixed; inset: 0; }

  /* ================= 真实 HERO 复刻（视频 + 标题 + 猫咪抠像） ================= */
  .hero { position: absolute; inset: 0; overflow: hidden; background: #000; }
  .hero .hero-bg,
  .hero .hero-alpha {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }
  .hero .hero-bg { z-index: 1; }
  .hero .hero-alpha { z-index: 3; }
  .hero .title-layer {
    position: absolute;
    left: 50%;
    top: 47%;
    z-index: 2;
    width: min(78vw, 1320px);
    aspect-ratio: 1640 / 241;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .hero .title-layer svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 0 18px rgba(190, 220, 255, 0.12));
  }
  .hero .title-layer path {
    opacity: 0;
    filter: blur(52px);
    transform-box: fill-box;
    transform-origin: center center;
    will-change: opacity, filter;
  }
  .hero.is-in .title-layer path {
    opacity: 1;
    filter: blur(0);
    transition:
      opacity 1.8s cubic-bezier(0.22, 0.8, 0.3, 1) var(--d, 0s),
      filter 1.8s cubic-bezier(0.22, 0.8, 0.3, 1) var(--d, 0s);
  }

  .hero .scroll-hint {
    position: absolute;
    left: 50%;
    bottom: clamp(28px, 4.8vh, 54px);
    z-index: 8;
    width: 20px;
    height: 32px;
    border: 1px solid rgba(255, 255, 255, 0.56);
    border-radius: 999px;
    transform: translateX(-50%);
    opacity: 0;
    pointer-events: none;
  }
  .hero.is-in .scroll-hint { opacity: 1; transition: opacity 1.2s ease 2.2s; }
  .hero .scroll-hint i {
    position: absolute;
    left: 50%;
    top: 6px;
    width: 2px;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.34);
    transform: translateX(-50%);
    animation: scrollWheel 1.9s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }
  @keyframes scrollWheel {
    0% { transform: translate(-50%, 0); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: translate(-50%, 12px); opacity: 0; }
  }

  /* ================= LOADER：流星划过夜空 ================= */
  .loader {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: linear-gradient(
      180deg,
      #040814 0%,
      #081636 42%,
      #122b58 62%,
      #23446f 74%,
      #16253f 86%,
      #0c1526 100%
    );
    transition: opacity 1.6s ease;
  }
  .loader.is-done { opacity: 0; pointer-events: none; }
  .loader canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .hud {
    position: absolute;
    top: clamp(64px, 10vh, 92px);
    right: clamp(28px, 4vw, 60px);
    display: grid;
    justify-items: end;
    gap: 10px;
    pointer-events: none;
  }
  .hud .label {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.5em;
    color: rgba(214, 230, 255, 0.5);
  }
  .hud .pct {
    font-weight: 300;
    font-size: clamp(38px, 5vw, 64px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    text-shadow: 0 0 34px rgba(150, 190, 255, 0.4);
  }
  .hud .pct::after {
    content: "%";
    margin-left: 3px;
    font-size: 0.46em;
    color: rgba(151, 178, 231, 0.9);
  }

  .replay {
    position: fixed;
    top: 22px;
    right: 26px;
    z-index: 20;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.4);
    color: rgba(255, 255, 255, 0.82);
    font-size: 12px;
    letter-spacing: 0.18em;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: border-color 0.25s ease, color 0.25s ease;
  }
  .replay:hover { border-color: rgba(151, 178, 231, 0.65); color: #fff; }
</style>

<body>
<div class="stage">

  <div class="hero" id="hero" aria-label="Hero video">
    <video class="hero-bg" src="../public/media/hero-base.mp4" autoplay muted loop playsinline preload="auto"></video>
    <div class="title-layer" id="titleLayer"></div>
    <video class="hero-alpha" src="../public/media/hero-cat-alpha.webm" autoplay muted loop playsinline preload="auto"></video>
    <div class="scroll-hint" aria-hidden="true"><i></i></div>
  </div>

  <!-- LOADER：一颗主流星拖出进度，坠点绽放成光晕，光晕里浮现真实 hero -->
  <div class="loader" id="loader">
    <canvas id="sky"></canvas>
    <div class="hud">
      <span class="label">FOUR · PORTFOLIO</span>
      <span class="pct" id="pct">0</span>
    </div>
  </div>

  <script src="./hero-videos.js"></script>
  <button class="replay" id="replay" type="button">↻ REPLAY</button>
</div>

<script src="./hero-replica.js"></script>
<script>
(function () {
  'use strict';

  window.__installHeroTitle();

  var hero = document.getElementById('hero');
  var loader = document.getElementById('loader');
  var pct = document.getElementById('pct');
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');

  var T = { count: 3.4, flare: 1.3 };

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, stars = [];

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function makeStars() {
    stars = [];
    var n = Math.round(Math.min(200, (W * H) / 9500));
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.7,
        r: 0.4 + Math.random() * 1.2,
        a: 0.25 + Math.random() * 0.55,
        tw: Math.random() * Math.PI * 2,
        ts: 0.5 + Math.random() * 1.4
      });
    }
  }
  makeStars();
  window.addEventListener('resize', makeStars);

  // 主流星的飞行路径：右上 → 画面中心（hero 标题所在处），二次贝塞尔
  function flightPoint(q) {
    var p0 = { x: W * 0.9, y: H * 0.08 };
    var p1 = { x: W * 0.7, y: H * 0.05 };
    var p2 = { x: W * 0.5, y: H * 0.45 };
    var a = 1 - q;
    return {
      x: a * a * p0.x + 2 * a * q * p1.x + q * q * p2.x,
      y: a * a * p0.y + 2 * a * q * p1.y + q * q * p2.y
    };
  }

  var easeInOut = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
  var easeOut = function (t) { return 1 - Math.pow(1 - t, 3); };
  var clamp01 = function (t) { return Math.min(Math.max(t, 0), 1); };

  var started = 0;
  var raf = 0;
  var lastNow = 0;
  var trail = [];
  var ambient = []; // 偶发的背景小流星
  var nextAmbient = 0;

  function spawnAmbient(now) {
    ambient.push({
      x0: W * (0.05 + Math.random() * 0.5),
      y0: H * (0.04 + Math.random() * 0.2),
      dx: -(0.16 + Math.random() * 0.14) * W,
      dy: (0.06 + Math.random() * 0.08) * H,
      born: now,
      life: 0.55 + Math.random() * 0.35
    });
    nextAmbient = now + 900 + Math.random() * 900;
  }

  function frame(now) {
    var t = (now - started) / 1000;
    var dt = Math.min((now - lastNow) / 1000, 0.05) || 0.016;
    lastNow = now;
    var p = easeInOut(clamp01(t / T.count));
    var flareT = clamp01((t - T.count) / T.flare);

    ctx.clearRect(0, 0, W, H);

    // 星空
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var twinkle = 0.55 + 0.45 * Math.sin(s.tw + now * 0.001 * s.ts);
      ctx.beginPath();
      ctx.fillStyle = 'rgba(205, 222, 255, ' + (s.a * twinkle).toFixed(3) + ')';
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 背景偶发流星
    if (now >= nextAmbient && t < T.done) spawnAmbient(now);
    for (var j = ambient.length - 1; j >= 0; j--) {
      var m = ambient[j];
      var mq = (now - m.born) / (m.life * 1000);
      if (mq >= 1) { ambient.splice(j, 1); continue; }
      var mx = m.x0 + m.dx * mq;
      var my = m.y0 + m.dy * mq;
      var mAlpha = Math.sin(mq * Math.PI) * 0.7;
      ctx.strokeStyle = 'rgba(190, 214, 255, ' + mAlpha.toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx - m.dx * 0.12, my - m.dy * 0.12);
      ctx.stroke();
    }

    // 主流星 + 持久轨迹
    if (t < T.count + 0.1) {
      var head = flightPoint(p);
      trail.push(head);
      if (trail.length > 26) trail.shift();
    }
    if (trail.length > 1) {
      for (var k = 1; k < trail.length; k++) {
        var seg = k / trail.length;
        ctx.strokeStyle = 'rgba(198, 220, 255, ' + (seg * 0.65).toFixed(3) + ')';
        ctx.lineWidth = 0.6 + seg * 1.6;
        ctx.beginPath();
        ctx.moveTo(trail[k - 1].x, trail[k - 1].y);
        ctx.lineTo(trail[k].x, trail[k].y);
        ctx.stroke();
      }
    }
    if (t < T.count) {
      var headNow = flightPoint(p);
      var glow = ctx.createRadialGradient(headNow.x, headNow.y, 0, headNow.x, headNow.y, 26);
      glow.addColorStop(0, 'rgba(235, 244, 255, 0.95)');
      glow.addColorStop(0.3, 'rgba(170, 200, 255, 0.5)');
      glow.addColorStop(1, 'rgba(170, 200, 255, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(headNow.x, headNow.y, 26, 0, Math.PI * 2);
      ctx.fill();
    }

    // 100%：坠点绽放，光晕扩张的同时 loader 淡出，露出底下已在播放的 hero
    if (flareT > 0) {
      var end = flightPoint(1);
      var radius = easeOut(flareT) * Math.max(W, H) * 0.85;
      var flare = ctx.createRadialGradient(end.x, end.y, 0, end.x, end.y, radius);
      var fade = 1 - flareT;
      flare.addColorStop(0, 'rgba(226, 238, 255, ' + (0.85 * fade).toFixed(3) + ')');
      flare.addColorStop(0.35, 'rgba(150, 185, 250, ' + (0.4 * fade).toFixed(3) + ')');
      flare.addColorStop(1, 'rgba(150, 185, 250, 0)');
      ctx.fillStyle = flare;
      ctx.fillRect(0, 0, W, H);
    }

    pct.textContent = String(Math.round(p * 100));

    if (t >= T.count && !loader.classList.contains('is-done')) {
      loader.classList.add('is-done');
      hero.classList.add('is-in');
    }
    if (t >= T.count + T.flare + 0.4) return;

    raf = requestAnimationFrame(frame);
  }

  function play() {
    cancelAnimationFrame(raf);
    started = performance.now();
    lastNow = started;
    trail = [];
    ambient = [];
    nextAmbient = started + 700;
    loader.classList.remove('is-done');
    hero.classList.remove('is-in');
    pct.textContent = '0';
    void loader.offsetWidth;
    raf = requestAnimationFrame(frame);
  }

  document.getElementById('replay').addEventListener('click', play);

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    loader.classList.add('is-done');
    hero.classList.add('is-in');
    pct.textContent = '100';
  } else {
    play();
  }
})();
</script>
</body>
</html>
