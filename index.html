<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://static.cloudflareinsights.com" crossorigin />
    <title>UI / Visual / AI Designer Portfolio</title>
    <script>
      (function () {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var forced = params.get('device');
        var ua = navigator.userAgent || '';
        // `MicroMessenger` deliberately absent: desktop WeChat puts it in a
        // Windows/Mac UA, which would wrongly classify it as a phone. Mobile
        // WeChat always carries Android/iPhone + "Mobile" anyway.
        var uaMobile = /Android|iPhone|iPod|iPad|Windows Phone|Mobile|HarmonyOS/i.test(ua);
        var iPadDesktopUA = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
        var touchOnly = (navigator.maxTouchPoints || 0) > 0 && !window.matchMedia('(hover: hover)').matches;
        var narrow = window.matchMedia('(max-width: 900px)').matches;
        // Width-priority upgrade: a touch device whose *logical* viewport is
        // already tablet-sized (>=1024 CSS px: 12.9" iPad, tablets landscape)
        // gets the desktop layout. High-DPI phones stay far below the threshold
        // (360-480 CSS px after DPR division), so they can never misjudge.
        // Judged once at first paint; rotating a tablet mid-session does not
        // flip the layout for the rest of the visit.
        var bigTouch = (navigator.maxTouchPoints || 0) > 0 && window.matchMedia('(min-width: 1024px)').matches;
        var isMobile = forced === 'mobile' ? true
          : forced === 'desktop' ? false
            : (bigTouch ? false : (uaMobile || iPadDesktopUA || (touchOnly && narrow)));
        root.setAttribute('data-device', isMobile ? 'mobile' : 'desktop');
        // Mobile WeChat paints the hero through WebCodecs, which fetches a raw
        // H.264 clip from JS — normally that request can only start once React
        // has booted. Preloading it here lets the clip download in parallel
        // with the app bundle, which is what keeps the bigger 1440x2560 source
        // from delaying the first painted frame.
        if (isMobile && /MicroMessenger/i.test(ua)) {
          var preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'fetch';
          // An `as="fetch"` preload only matches a fetch() request when their
          // CORS settings agree; plain fetch() runs in CORS mode, so the
          // attribute is required — without it the clip would download twice.
          preload.crossOrigin = 'anonymous';
          preload.href = '/media/hero-mobile-webcodecs.264';
          document.head.appendChild(preload);
        }
        // Native-video paths: preload the exact hero clips this device will
        // play, using the SAME decision React makes in HeroSection (device +
        // HEVC canPlayType + WeChat branch). Without this the browser only
        // discovers the videos after the JS bundle has downloaded, parsed and
        // mounted HeroSection, so the ~1.9MB of hero media queues behind the
        // app instead of downloading in parallel with it. as="video" (no
        // crossOrigin) matches the media element's same-origin no-cors
        // request, and the ETag on the server turns the media element's
        // revalidation into a 304 so nothing downloads twice.
        var heroPreload = function (href) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'video';
          link.href = href;
          link.fetchPriority = 'high';
          document.head.appendChild(link);
        };
        // Desktop hero poster (first frame still): 83KB, but without a preload
        // it queues behind the whole app bundle and the black-hero window
        // grows instead of shrinking.
        var heroPosterPreload = function () {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = '/media/hero-pc-poster.webp';
          link.fetchPriority = 'high';
          document.head.appendChild(link);
        };
        var heroSupportsHEVC = (function () {
          try {
            var v = document.createElement('video');
            return /^(probably|maybe)$/.test(v.canPlayType('video/mp4; codecs="hvc1.1.6.L153.B0"'))
              || /^(probably|maybe)$/.test(v.canPlayType('video/mp4; codecs="hvc1"'));
          } catch (e) { return false; }
        })();
        if (isMobile) {
          // WeChat mobile paints through WebCodecs (preloaded above); its
          // native-video fallbacks only engage after a decoder failure, so
          // they are deliberately NOT preloaded.
          if (!/MicroMessenger/i.test(ua)) {
            heroPreload(heroSupportsHEVC ? '/media/hero-mobile.mp4' : '/media/hero-mobile-fallback.mp4');
          }
        } else if (/MicroMessenger/i.test(ua)) {
          // Desktop WeChat is forced onto the H.264 fallback pair in
          // HeroSection regardless of HEVC support.
          heroPreload('/media/hero-base.mp4');
          heroPreload('/media/hero-mask-fallback.mp4');
          heroPosterPreload();
        } else if (heroSupportsHEVC) {
          heroPreload('/media/hero-hevc.mp4');
          heroPreload('/media/hero-mask-hevc.mp4');
          heroPosterPreload();
        } else {
          heroPreload('/media/hero-base.mp4');
          heroPreload('/media/hero-mask-fallback.mp4');
          heroPosterPreload();
        }
        // The home route always uses one-screen paging. Keep secondary routes
        // in their regular document flow from the first paint.
        var hash = window.location.hash || '';
        var homeRoute = hash === '' || hash === '#';
        root.setAttribute('data-paging', homeRoute ? 'on' : 'off');
        // Take scroll restoration away from the browser before it can apply a
        // saved position. The paged home decides the starting screen itself,
        // so a restored offset (e.g. wherever the visitor last was) must never
        // become the initial screen and then get "aligned" to by the pager.
        if ('scrollRestoration' in history) {
          try { history.scrollRestoration = 'manual'; } catch (_) {}
        }
        // --vh is the *visible* viewport, not the 100vh unit. On a phone those
        // differ: 100vh resolves against the largest viewport (address bar
        // hidden) while the bar is usually on screen. The paged home measures
        // every screen against this value, so it has to follow the real height.
        var syncHeight = function () {
          root.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
        };
        syncHeight();
        window.addEventListener('resize', syncHeight);
        window.addEventListener('orientationchange', function () {
          window.setTimeout(syncHeight, 120);
        });
        // Mobile browsers resize the layout viewport when the address bar
        // slides away, and they do not always fire a window resize for it.
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncHeight);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
