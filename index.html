<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <!-- 首屏 Loading 遮罩的关键样式必须内联：外链 CSS 要等构建产物下载完才生效，
         那时已经晚于第一帧，会先闪一下空白。底色必须是 #111719（demo 被运行时
         注入后的最终色）：2026-10-09 之前这里写的是 demo 原始的 #151f2a（蓝灰），
         而 iframe 加载后的注入会把 demo 换成 #111719 —— 刷新瞬间就有一帧到几帧
         的蓝色页面残留（业主在移动端实测看到）。三处（html / 遮罩 / demo 原始
         背景）现在统一为 #111719，任何时刻都看不到蓝色阶段。
         ⚠ iframe 门控（同日第二轮）：demo 是渐进渲染的，iframe 加载期间浏览器会
         先画原始背景、再画猫，而「居中 viewBox / 光晕 / 真进度条替换」全在 load
         事件后由注入完成 —— 注入生效前的每一帧都是未处理原貌（未居中的猫 + 假
         进度条 + 旧蓝渐变），业主看到的"猫的残留闪现"就是它。所以 iframe 初始
         opacity:0，注入落位（或 600ms 降级）后才显示，未注入态永远不会被看见。 -->
    <style>
      html { background: #111719; }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        /* 底色与 demo 注入后的 main 背景同源（radial #161d1e → #111719）。iframe 还没
           解析出 .copy 的那段等待期里（有时几十到几百 ms），遮罩不再是"一块纯黑"，
           而是与随后出现的 demo 同色同构 ⇒ 视觉无缝，不再被读成"先黑一下"。 */
        background: #111719;
        background: radial-gradient(ellipse at 50% 49%, #161d1e 0%, #111719 68%);
        opacity: 1;
        transition: opacity .5s ease;
      }
      #app-loader.is-gone { opacity: 0; pointer-events: none; }
      #app-loader.is-off { display: none; }
      #app-loader > iframe {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        color-scheme: dark;
        opacity: 0;
        transition: opacity .3s ease;
      }
      #app-loader > iframe.is-in { opacity: 1; }
      /* 静态猫占位：iframe 就绪前盖在下面，空窗期直接显示猫，不再是一块纯色。
         与 iframe 内的 demo 同源（viewBox 平移 / 光晕 / 接地阴影 / 进度条位置都照搬），
         所以 iframe 以 0→1 淡入覆盖时两者画面一致，无跳变。 */
      .loader-static { width: min(570px, 97vw); }
      .loader-static .loader { width: min(570px, 97vw); text-align: center; }
      .loader-static .scene { }
      .loader-static .art { display: block; width: calc(100% * .8); margin-inline: auto; height: auto; overflow: visible; }
      .loader-static .copy {
        margin-top: -4px;
        /* ★ 高度必须恒等于「p 22 + 进度条 margin 17 + 进度条高 10」= 49px。
           进度条是唯一 DOM 节点，placeIntoDemo 把它搬进 iframe 的瞬间，若这里
           高度跟着塌回 22px，静态块总高 323→296，grid 重新居中会让静态猫
           瞬间下坠 13px、再被淡入的 iframe 拉回 —— 业主看到的"猫跳帧位移"。
           钉死高度后搬走进度条不再改变块高，居中零漂移。 */
        height: 49px;
      }
      .loader-static .copy p { margin: 0; font: 11px/22px "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 4px; color: #cbd4dc; }
      .loader-static .app-loader-progress {
        position: static;
        left: auto;
        bottom: auto;
        transform: none;
        margin: 17px auto 0;
        width: fit-content;
      }
      /* 进度读数：宽度/字号/字距都抄 iframe 内统一排版（rail 用 #8b9eaf、副文字
         10px/1px 字距、#8291a0），所以它是"长在 demo 里"的，而不是外来控件。 */
      .app-loader-progress {
        position: absolute;
        left: 50%;
        bottom: 34px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: none;
      }
      .app-loader-bar {
        position: relative;
        width: 140px;
        height: 2px;
        background: rgba(185, 203, 213, 0.09);
        overflow: hidden;
      }
      .app-loader-bar > i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: #8b9eaf;
        transition: width .28s ease;
      }
      .app-loader-num {
        font: 10px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
        letter-spacing: 1px;
        color: #8291a0;
        font-variant-numeric: tabular-nums;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader { transition: none; }
        #app-loader > iframe { transition: none; }
        .app-loader-bar > i { transition: none; }
      }
    </style>
    <noscript><style>#app-loader { display: none; }</style></noscript>
    <link rel="preconnect" href="https://static.cloudflareinsights.com" crossorigin />
    <!-- 首屏 Loading 的 iframe 文档（/loading/loader.html，21.5KB 同域）在 head 阶段就
         preload。不加这一条时浏览器把 iframe 导航排在主 JS/CSS 之后（iframe 是低优先级
         destination），无缓存实测要等 ~1.5s 才解析出 .copy，而这段等待里 iframe 恒
         opacity:0 ⇒ 遮罩只剩一块纯色，业主报的「进入 Loading 一瞬间短暂黑屏」就是它。
         preload 后该文档与首屏并行到达，注入落位的等待期压到网络往返量级。 -->
    <link rel="preload" as="document" href="/loading/loader.html?embed" />
    <title>UI / Visual / AI Designer Portfolio</title>
    <script>
      (function () {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var forced = params.get('device');
        var ua = navigator.userAgent || '';
        // `MicroMessenger` deliberately absent: desktop WeChat puts it in a
        // Windows/Mac UA, which would wrongly classify it as a phone. Mobile
        // WeChat always carries Android/iPhone + "Mobile" anyway.
        var uaMobile = /Android|iPhone|iPod|iPad|Windows Phone|Mobile|HarmonyOS/i.test(ua);
        var iPadDesktopUA = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
        var touchOnly = (navigator.maxTouchPoints || 0) > 0 && !window.matchMedia('(hover: hover)').matches;
        var narrow = window.matchMedia('(max-width: 900px)').matches;
        // Width-priority upgrade: a touch device whose *logical* viewport is
        // already tablet-sized (>=1024 CSS px: 12.9" iPad, tablets landscape)
        // gets the desktop layout. High-DPI phones stay far below the threshold
        // (360-480 CSS px after DPR division), so they can never misjudge.
        // Judged once at first paint; rotating a tablet mid-session does not
        // flip the layout for the rest of the visit.
        var bigTouch = (navigator.maxTouchPoints || 0) > 0 && window.matchMedia('(min-width: 1024px)').matches;
        var isMobile = forced === 'mobile' ? true
          : forced === 'desktop' ? false
            : (bigTouch ? false : (uaMobile || iPadDesktopUA || (touchOnly && narrow)));
        root.setAttribute('data-device', isMobile ? 'mobile' : 'desktop');
        // Mobile WeChat paints the hero through WebCodecs, which fetches a raw
        // H.264 clip from JS — normally that request can only start once React
        // has booted. Preloading it here lets the clip download in parallel
        // with the app bundle, which is what keeps the bigger 1440x2560 source
        // from delaying the first painted frame.
        if (isMobile && /MicroMessenger/i.test(ua)) {
          var preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'fetch';
          // An `as="fetch"` preload only matches a fetch() request when their
          // CORS settings agree; plain fetch() runs in CORS mode, so the
          // attribute is required — without it the clip would download twice.
          preload.crossOrigin = 'anonymous';
          preload.href = '/media/hero-mobile-webcodecs.264';
          document.head.appendChild(preload);
          window.__bootAssets.push({ href: '/media/hero-mobile-webcodecs.264', kind: 'video' });
          // JSMpeg 是 WeChat 的**终极回退**（原生 video 解码失败后才用，138KB，
          // 在 main.jsx 里按需注入）。它对 WeChat 用户是首屏关键路径的一环，
          // 却要等 React 起来、发现解码失败之后才开始下载 —— 那正好是最不能卡的时刻。
          // 只给 WeChat 预载（其余浏览器永远用不到这 138KB）。
          var jsm = document.createElement('link');
          jsm.rel = 'preload';
          jsm.as = 'script';
          jsm.href = '/vendor/jsmpeg.min.js';
          document.head.appendChild(jsm);
          window.__bootAssets.push({ href: '/vendor/jsmpeg.min.js', kind: 'script' });
        }
        // Native-video paths: preload the exact hero clips this device will
        // play, using the SAME decision React makes in HeroSection (device +
        // HEVC canPlayType + WeChat branch). Without this the browser only
        // discovers the videos after the JS bundle has downloaded, parsed and
        // mounted HeroSection, so the ~1.9MB of hero media queues behind the
        // app instead of downloading in parallel with it. as="video" (no
        // crossOrigin) matches the media element's same-origin no-cors
        // request, and the ETag on the server turns the media element's
        // revalidation into a 304 so nothing downloads twice.
        // 首屏 Loading 的进度来源：这里发出的每个 preload 都是 React 首屏真正要用
        // 的资源，把它们登记下来，进度条就不再是假动画，而是"这些文件下完了多少"。
        window.__bootAssets = [];
        var heroPreload = function (href) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'video';
          link.href = href;
          link.fetchPriority = 'high';
          document.head.appendChild(link);
          window.__bootAssets.push({ href: href, kind: 'video' });
        };
        // Desktop hero poster (first frame still): 83KB, but without a preload
        // it queues behind the whole app bundle and the black-hero window
        // grows instead of shrinking.
        var heroPosterPreload = function () {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = '/media/hero-pc-poster.webp';
          link.fetchPriority = 'high';
          document.head.appendChild(link);
          window.__bootAssets.push({ href: '/media/hero-pc-poster.webp', kind: 'image' });
        };
        var heroSupportsHEVC = (function () {
          try {
            var v = document.createElement('video');
            return /^(probably|maybe)$/.test(v.canPlayType('video/mp4; codecs="hvc1.1.6.L153.B0"'))
              || /^(probably|maybe)$/.test(v.canPlayType('video/mp4; codecs="hvc1"'));
          } catch (e) { return false; }
        })();
        // 用 canPlayType 同步决定 HEVC 走哪一对视频。preload 与 React 侧的 assetMode
        // 必须同一结论：这里同步把结论写进 window.__heroHevcProbe，React 的 HeroSection
        // 直接读它（未定义时退回 canPlayType，与本分支一致）。两者永远一致，绝不会出现在
        // 首帧之后才换 assetMode、把 base/alpha 两个 <video> 整体重建的「中途降级」。
        // （曾改用 MediaCapabilities 做异步探测来提前规避降级，但它与 canPlayType 结论
        // 可能相左且存在竞态，导致 index 预载与 React 渲染错配、视频起播失败而冻结。）
        window.__heroHevcProbe = !!heroSupportsHEVC;
        if (isMobile) {
          // WeChat mobile paints through WebCodecs (preloaded above); its
          // native-video fallbacks only engage after a decoder failure, so
          // they are deliberately NOT preloaded.
          if (!/MicroMessenger/i.test(ua)) {
            heroPreload(heroSupportsHEVC ? '/media/hero-mobile.mp4' : '/media/hero-mobile-fallback.mp4');
          }
        } else if (/MicroMessenger/i.test(ua)) {
          // Desktop WeChat is forced onto the H.264 fallback pair in
          // HeroSection regardless of HEVC support.
          heroPreload('/media/hero-base.mp4');
          heroPreload('/media/hero-mask-fallback.mp4');
          heroPosterPreload();
        } else if (heroSupportsHEVC) {
          heroPreload('/media/hero-hevc.mp4');
          heroPreload('/media/hero-mask-hevc.mp4');
          heroPosterPreload();
        } else {
          heroPreload('/media/hero-base.mp4');
          heroPreload('/media/hero-mask-fallback.mp4');
          heroPosterPreload();
        }

        // ── 字体（2026-10-13，GPT 清单第 4 条「实际使用字体的加载」）──────────
        // Rany Display 只用在几处大号英文标题上（Project Display / Hi, I Am Four /
        // 作品标题），但 @font-face 是 display:swap：字体往往在标题已经上屏之后才到，
        // 用户会看到一次换字 + 整块重排（项目的 measure 钩子还得为此在 fonts.ready
        // 之后再测一遍几何）。全量 4 个字重 198KB 没必要 —— 真正会被渲染的是
        // **500（.mob-heading / .pf-title-en 显式 500）与 700（h2 默认粗体，
        // .display-reveal-title 没有覆写 font-weight）**，只 preload 这两个。
        // ⚠ as="font" 必须带 crossOrigin：字体一律按 CORS 取，缺这个属性会变成
        //   "预载了但没用上"，白下一遍。
        var fontPreload = function (href) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'font';
          link.type = 'font/ttf';
          link.crossOrigin = 'anonymous';
          link.href = href;
          document.head.appendChild(link);
          window.__bootAssets.push({ href: href, kind: 'font' });
        };
        fontPreload('/fonts/Rany-Medium.ttf');
        fontPreload('/fonts/Rany-Bold.ttf');

        // 移动端 hero 首帧海报：PC 一直有 heroPosterPreload()，移动端过去没有。
        // 视频首帧上屏之前的黑屏窗口里，它是最便宜的一块补丁（28KB，已在
        // HERO_MOBILE_POSTER_SRC 里用到，path 与 React 侧一致）。
        if (isMobile && !/MicroMessenger/i.test(ua)) {
          var mobilePoster = document.createElement('link');
          mobilePoster.rel = 'preload';
          mobilePoster.as = 'image';
          mobilePoster.fetchPriority = 'high';
          mobilePoster.href = '/media/hero-mobile-poster.webp';
          document.head.appendChild(mobilePoster);
          window.__bootAssets.push({ href: '/media/hero-mobile-poster.webp', kind: 'image' });
        }
        // The home route always uses one-screen paging. Keep secondary routes
        // in their regular document flow from the first paint.
        var hash = window.location.hash || '';
        var homeRoute = hash === '' || hash === '#';
        root.setAttribute('data-paging', homeRoute ? 'on' : 'off');
        // Take scroll restoration away from the browser before it can apply a
        // saved position. The paged home decides the starting screen itself,
        // so a restored offset (e.g. wherever the visitor last was) must never
        // become the initial screen and then get "aligned" to by the pager.
        if ('scrollRestoration' in history) {
          try { history.scrollRestoration = 'manual'; } catch (_) {}
        }
        // --vh is the *visible* viewport, not the 100vh unit. On a phone those
        // differ: 100vh resolves against the largest viewport (address bar
        // hidden) while the bar is usually on screen. The paged home measures
        // every screen against this value, so it has to follow the real height.
        var syncHeight = function () {
          root.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
        };
        syncHeight();
        window.addEventListener('resize', syncHeight);
        window.addEventListener('orientationchange', function () {
          window.setTimeout(syncHeight, 120);
        });
        // Mobile browsers resize the layout viewport when the address bar
        // slides away, and they do not always fire a window resize for it.
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncHeight);
        }
      })();
    </script>
  </head>
  <body>
    <!-- 首屏 Loading：动画放在 public/loading/loader.html，仅提高眨眼频率；
         这里做「嵌入 + 背景/接触阴影 + 进度 + 揭幕」。
         ⚠ 2026-10-10 业主「loading 进入一瞬间能看到 demo 残留」：该文件原先是从
         猫动画 demo 直接拷来的，自带左上角版本标 .mast(v1.1 / TUXEDO CAT) 与底部
         版本切换条 .controls(v1.0/v1.1/02/03/04 + 暂停/1.0×/纯净)，只靠运行时 JS
         加 .embedded 类隐藏 —— 挂载首帧来不及，于是闪一下。现在这些节点连同其
         CSS/交互代码已从文件里**整体删除**（不是隐藏），并把文件名去掉 demo 味。
         剩余 ?embed 只用于让画面收窄到 min(570px,97vw) 的嵌入排版。
         只有首页会显示：二级(works)/三级(detail)页刷新直接进内容，不挡路。 -->
    <!-- 遮罩本体由下面的脚本创建，HTML 里故意不放这个 div：Chrome 会在解析过程中
         穿插绘制，若 div 先于脚本出现，二级/三级页刷新就有可能闪一帧纯色遮罩。
         现在只有判定为首页时它才会被插进 DOM，其余路由连节点都不存在。 -->
    <script>
      (function () {
        // 路由判定与 src/main.jsx 的 parseRoute 保持一致：凡是不是 works /
        // detail 的 hash 都算首页。
        var hash = window.location.hash || '';
        var isHome = !/^#\/(works|detail)/.test(hash);
        if (!isHome) return; // 二级/三级页刷新：连遮罩节点都不建

        var el = document.createElement('div');
        el.id = 'app-loader';
        el.setAttribute('aria-busy', 'true');
        el.setAttribute('aria-label', '页面加载中');
        document.body.appendChild(el);
        var drop = function () { if (el && el.parentNode) el.remove(); };

        //    接地阴影都照搬 placeIntoDemo 注入的结果），于是空窗期看到的是猫而非纯色。
        //    iframe 透明度 0→1 淡入覆盖时，两者画面一致（猫+光晕+接地阴影+进度条），

        frame.addEventListener('load', function () { markNavigated(); placeIntoDemo(); });
        // 命中缓存时 load 有可能在监听之前就已经触发，补两次机会。
        window.setTimeout(placeIntoDemo, 0);
        window.setTimeout(placeIntoDemo, 400);
        /* 降级（2026-10-10 重做，修「loading 瞬间闪出 demo 原貌」bug）：
           原版在固定 600ms 无条件开门（is-in）+ 退回遮罩底部进度条。慢网络下
           600ms 时 demo 文档往往还在流式加载（readyState='loading'，.copy 未
           解析出来），而门已开 ⇒ 接下来 demo 文档一到，浏览器先画它的**注入前
           原貌**（旧蓝渐变 #151f2a + 未居中的猫 + 假进度条 .rail），直到 load
           事件里 placeIntoDemo 跑完才被替换 —— 业主看到的「loading 瞬间闪出
           以前的 demo 页面 + 进度条」就是这个窗口（手机实测，弱网更明显）。
           新逻辑分三档，失败方向永远是"多等"而不是"露原貌"：
             ① 文档里有 .copy（demo 已解析完）→ 正常 placeIntoDemo；
             ② 文档 readyState=complete 但没有 .copy（加载失败页/异常）→ 开门，
                但同时强灌 #111719 深色底，绝无原貌可露；
             ③ 文档还在加载（readyState='loading'）→ 继续每 150ms 重试，不开门。
           最后再垫一层 8s 硬兜底：无论文档什么状态都强灌深色底后开门，
           保证极端情况下 loading 也不会永远停在纯色遮罩上。 */
        var forceDark = function () {
          try {
            var d = frame.contentDocument;
            if (d && d.head) {
              var s = d.createElement('style');
              s.textContent = ':root,html,body{background:#111719!important}';
              d.head.appendChild(s);
            }
          } catch (_) { /* noop */ }
        };
        var openWithOverlay = function () {
          el.appendChild(progress.root);
          forceDark();
          frame.classList.add('is-in');
        };
        var gateStart = 0; // 首次进闸门时打点，用于「始终没导航」的 4s 兜底
        var fallbackTimer = window.setTimeout(function tryGate() {
          if (placed) return;
          if (!gateStart) gateStart = performance.now();
          markNavigated();
          var doc = null;
          try { doc = frame.contentDocument; } catch (_) { doc = null; }
          if (doc && doc.querySelector('.copy')) { placeIntoDemo(); return; }
          // ★ 必须 navigated 才认「complete 但没 .copy」；否则那是 iframe 的初始空白文档，
          //   开门只会露出纯色遮罩 + 底部进度条（业主看到的「底部那个进度条」）。
          if (navigated && doc && doc.readyState === 'complete') { openWithOverlay(); return; }
          if (!navigated && performance.now() - gateStart > 4000) { openWithOverlay(); return; }
          fallbackTimer = window.setTimeout(tryGate, 150);
        }, 600);
        window.setTimeout(function () {
          if (placed) return;
          openWithOverlay();
          window.clearTimeout(fallbackTimer);
        }, 8000);

        // ---- 真实进度：每项都是一个 0..1 的探针，按权重加权 ----
        // 只有能真正观测到的量才计入，凑不出来的就不假装：
        //   · 脚本/图片/预取文件：performance 资源条目有 responseEnd 才算完成；
        //   · 视频：读 <video> 的 buffered 区间（能拿到真实的字节进度），
        //     拿不到就退回"资源条目完成"这种 0/1 判定；
        //   · React 首屏就绪：由 app:ready 事件给出。
        var tasks = [];
        var addEntryTask = function (href, weight, cap) {
          tasks.push({
            weight: weight,
            read: function () {
              var value = 0;
              try {
                var abs = new URL(href, location.href).href;
                var entries = performance.getEntriesByName(abs, 'resource');
                if (!entries.length) entries = performance.getEntriesByName(href, 'resource');
                if (entries.length && entries[entries.length - 1].responseEnd > 0) value = 1;
              } catch (_) { /* noop */ }
              // cap：下载完 ≠ 能流畅播，视频类留最后一段给 app:ready 判据。
              return cap ? Math.min(cap, value) : value;
            }
          });
        };
        var videoBuffered = function () {
          var list = document.querySelectorAll('video');
          if (!list.length) return 0;
          var sum = 0;
          var counted = 0;
          for (var i = 0; i < list.length; i++) {
            var v = list[i];
            var dur = v.duration;
            if (!isFinite(dur) || !dur) continue;
            try {
              sum += v.buffered.length ? Math.min(1, v.buffered.end(v.buffered.length - 1) / dur) : 0;
              counted++;
            } catch (_) { /* noop */ }
          }
          return counted ? sum / counted : 0;
        };
        (window.__bootAssets || []).forEach(function (asset) {
          // 视频是首屏字节大头（~1.9MB），权重给高，进度才不会"一上来就 90%"。
          var weight = asset.kind === 'video' ? 4 : 1;
          addEntryTask(asset.href, weight, asset.kind === 'video' ? 0.92 : 0);
          if (asset.kind === 'video') {
            tasks.push({
              weight: weight,
              read: function () {
                var buffered = videoBuffered();
                // 取两者较大值：buffered 更平滑，资源条目完成后直接封顶 1。
                var done = 0;
                try {
                  var abs = new URL(asset.href, location.href).href;
                  var entries = performance.getEntriesByName(abs, 'resource');
                  if (!entries.length) entries = performance.getEntriesByName(asset.href, 'resource');
                  if (entries.length && entries[entries.length - 1].responseEnd > 0) done = 1;
                } catch (_) { /* noop */ }
                // 下载完只算到 92%：剩下的 8% 必须由「视频真的能连续播」来补
                // （app:ready），否则条子会先跳到 100% 再干等，那就是假进度。
                return Math.min(0.92, Math.max(buffered, done));
              }
            });
          }
        });
        // 应用脚本（Vite 注入的 module + modulepreload）
        Array.prototype.forEach.call(document.querySelectorAll('script[src], link[rel="modulepreload"]'), function (node) {
          addEntryTask(node.src || node.href, 1);
        });
        // 首屏图片：视口内的 <img> 里已经 decode 完的比例。这是真能观测到的量
        // （complete + naturalWidth），不是按数量拍脑袋。
        var imagesProgress = function () {
          var list = document.querySelectorAll('img');
          var done = 0;
          var total = 0;
          for (var i = 0; i < list.length; i++) {
            var rect = list[i].getBoundingClientRect();
            if (rect.bottom < 0 || rect.top > window.innerHeight || !rect.width) continue;
            total++;
            if (list[i].complete && list[i].naturalWidth) done++;
          }
          return total ? done / total : 0;
        };
        tasks.push({ weight: 2, read: imagesProgress });

        // 外部进度（React 侧在 loading 阶段预载的内容：作品封面、尾屏 WebGL）：
        // 通过 window 'loading:progress' 事件上报 { id, weight, progress }，并入同一条
        // 加权进度条，于是条子会随封面一张张下完、尾屏着色器编译完而真实爬升，
        // 用户能直接"看见 loading 在干活"。权重在首次上报时锁定，之后只更新 progress。
        var external = {};
        window.addEventListener('loading:progress', function (e) {
          var d = e.detail || {};
          if (!d.id) return;
          if (!external[d.id]) {
            var w = (typeof d.weight === 'number' && d.weight > 0) ? d.weight : 2;
            external[d.id] = { weight: w, progress: 0 };
            tasks.push({ weight: w, read: function () { return external[d.id] ? external[d.id].progress : 0; } });
          }
          if (typeof d.progress === 'number') {
            external[d.id].progress = Math.max(external[d.id].progress, Math.min(1, d.progress));
          }
        });

        var ready = false; // 仅供 hide() 内部状态使用，不再作为进度项

        var shown = 0; // 已显示到的进度，只增不减
        var eased = 0; // 平滑逼近值：真实值是阶梯状的（资源一个个到位），
                       // 直接刷会让条子一格一格蹦，这里让它连续地追上去
        var paint = function (value) {
          // 只增不减：个别资源条目被缓存复用或重复登记时，进度条不能往回跳。
          if (value < shown) return;
          shown = value;
          var percent = Math.round(shown * 100);
          fill.style.width = percent + '%';
          num.textContent = percent + '%';
        };
        var tick = function () {
          var total = tasks.reduce(function (acc, t) { return acc + t.weight; }, 0) || 1;
          var sum = 0;
          for (var i = 0; i < tasks.length; i++) sum += tasks[i].weight * tasks[i].read();
          var target = Math.min(1, sum / total);
          eased += (target - eased) * 0.3;
          if (target - eased < 0.004) eased = target; // 收尾别拖着不到 100
          paint(eased);
        };

        var MIN_SHOW = 600;
        // 硬超时（最后的安全网，只在 app:ready 始终不来时才生效）。
        // ⚠ 2026-10-08：6s → 12s。揭幕闸门现在多了一道"尾屏灯光烧录"（见
        // Street.jsx / HomePage）：demo 的 intro 渐入被 clamp 到 0.05s/帧、无法快进，
        // 只能在遮罩期按受控帧率跑完 ~3.4s。原来的 6s 会在正常路径上提前揭幕
        // （首屏视频在慢网下本身就可能 >4s），那就等于把烧录又漏回 hero 播放期。
        // ⚠ 2026-10-13：12s → 18s。业主口径「确保视频能流畅播放，再结束 loading 页」：
        // 冷缓存慢网要 6~12s 才把首屏视频攒到 2.5s 余量，旧的 12s 会抢在 React 侧的
        // 质量闸门之前把遮罩收掉 —— 揭幕时视频还没攒够，进去就卡。这里只是"最后一道
        // 保险"（防某一闸门彻底不动把首屏永久扣住），正常路径 ~3.6s、慢网 6~12s 都远
        // 在它之前。等待期间进度条是按 <video> 的真实 buffered/duration 爬的。
        var HARD_CAP = 18000;
        var startedAt = Date.now();
        var hidden = false;
        var hide = function (finished) {
          if (hidden || !el) return;
          hidden = true;
          ready = true;
          window.clearInterval(timer);
          // 只有"真的加载完了"才补满 100%；触发硬超时说明没等到就绪，
          // 这时假装 100% 就是假进度，条子停在原处直接淡出。
          var wait = Math.max(0, MIN_SHOW - (Date.now() - startedAt));
          // 补满也要补得像真的：不是瞬间跳到 100%，而是让读数在剩下的等待时间里
          // 一段段爬上去，跟条子 0.28s 的宽度过渡同步（否则数字会先蹦到 100%，
          // 条子还在后面追，看着就像假进度）。
          var ramp = window.setInterval(function () {
            if (!finished) { window.clearInterval(ramp); return; }
            var pct = parseInt(num.textContent, 10) || 0;
            if (pct >= 100) { window.clearInterval(ramp); return; }
            num.textContent = Math.min(100, pct + 9) + '%';
          }, 40);
          window.setTimeout(function () {
            window.clearInterval(ramp);
            if (finished) paint(1);
            el.classList.add('is-gone');
            window.setTimeout(function () {
              el.classList.add('is-off');
              drop(); // 连 iframe 一起移除：demo 是 rAF 动画，残留会空转抢主线程
            }, 520);
          }, wait);
        };
        // 广播揭幕信号：首屏 SVG 入场由 app:ready 计时，所以**任何**让遮罩消失的
        // 路径都必须带着它，否则标题会永远停在 opacity:0。
        var announceReady = function () {
          window.__appRevealed = true;
          try { window.dispatchEvent(new Event('app:ready')); } catch (_) { /* noop */ }
        };
        window.__hideAppLoader = function () { announceReady(); hide(true); };
        window.addEventListener('app:ready', function () { ready = true; window.__appRevealed = true; hide(true); });
        var timer = window.setInterval(tick, 120);
        window.setTimeout(function () { window.clearInterval(timer); }, HARD_CAP + 200);
        // 兜底：无论如何 HARD_CAP 后必须揭幕，避免某一闸门（如 hero 视频在异常环境下
        // 始终不就绪）导致 loading 永久卡住。这是最后的安全网，正常路径由 app:ready 触发。
        // 硬超时也必须播报：只淡出遮罩而不给 app:ready，首屏标题就永远不入场。
        window.setTimeout(function () { if (!hidden) { announceReady(); hide(true); } }, HARD_CAP);
        // 兜底：hero 视频失败 / 微信端无原生 video 时 heroVideoReady 永不触发，
        // 也要揭幕（不补满进度）。
        window.setTimeout(function () { hide(false); }, HARD_CAP);
        tick();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
