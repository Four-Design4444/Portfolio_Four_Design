<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demo · PC 首页作品组 · 11 卡直排</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #050507;
    color: #fff;
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-x: hidden;
  }

  /* ===== 顶部导航（复刻上下文，非重点） ===== */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 26px 48px; z-index: 50;
  }
  .logo { font-weight: 700; letter-spacing: 0.42em; font-size: 15px; }
  .nav { display: flex; gap: 28px; font-size: 12px; color: rgba(255,255,255,0.55); }
  .nav span.on { color: #fff; border-bottom: 1px solid rgba(255,255,255,0.7); padding-bottom: 3px; }

  /* ===== 背景光束 ===== */
  .beam {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(60% 45% at 78% -5%, rgba(120,140,170,0.16), transparent 70%),
      radial-gradient(50% 40% at 12% 108%, rgba(90,100,130,0.08), transparent 70%);
  }

  /* ===== 区块 ===== */
  .section {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 120px 96px 60px;
  }
  .headline {
    font-size: clamp(48px, 6.4vw, 92px);
    font-weight: 800; letter-spacing: 0.01em; line-height: 1;
  }
  .tag {
    display: inline-block; margin-top: 22px;
    padding: 7px 18px; border: 1px solid rgba(120,150,255,0.65);
    border-radius: 999px; color: #9db4ff; font-size: 13px;
    width: fit-content;
  }

  /* ===== 11 卡卡组 ===== */
  .deck-wrap { margin-top: clamp(40px, 6vh, 80px); }
  .deck {
    position: relative;
    aspect-ratio: 10 / 3.2;
    touch-action: pan-y;
    isolation: isolate;
  }
  /* 地面光池 */
  .deck::after {
    content: '';
    position: absolute; left: 3%; right: 3%; top: 65%; bottom: 0;
    z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 8%, rgba(255,255,255,0.08), rgba(255,255,255,0.018) 38%, transparent 76%);
    filter: blur(12px);
    opacity: 0.72;
  }

  .card {
    --push: 0; --y: 0; --rot: 0; --scale: 1; --enter: 0px;
    position: absolute;
    left: var(--x);
    top: 40%;
    width: var(--w, 12.4%);
    aspect-ratio: 4 / 3;
    z-index: var(--z);
    opacity: 0;
    will-change: transform, opacity;
    transition:
      opacity 820ms cubic-bezier(0.22, 1, 0.36, 1),
      transform 900ms cubic-bezier(0.22, 1, 0.36, 1);
    transform: translate3d(
        calc(var(--push) * 1px),
        calc(-50% + var(--y) * 1px + var(--enter)),
        0
      )
      rotate(calc(var(--rot) * 1deg))
      scale(var(--scale));
  }
  .deck:not(.is-visible) .card { --enter: 54px; transition-delay: calc(var(--i) * 60ms); }
  .deck.is-visible .card { opacity: 1; transition-delay: 0ms; }

  .card button {
    position: relative; display: block; width: 100%; height: 100%;
    padding: 0; border: 0; border-radius: 12px; overflow: hidden;
    background: #0f0f12; cursor: pointer; appearance: none;
    box-shadow:
      0 12px 30px -18px rgba(0,0,0,0.9),
      0 4px 10px -6px rgba(0,0,0,0.8);
    transition: box-shadow 420ms ease;
  }
  .card.is-active button {
    box-shadow:
      0 22px 46px -22px rgba(0,0,0,0.94),
      0 6px 14px -6px rgba(0,0,0,0.82);
  }
  .card button img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    filter: saturate(0.9) contrast(1.04);
    transition:
      transform 680ms cubic-bezier(0.22, 1, 0.36, 1),
      filter 680ms ease;
  }
  .card.is-active button img { transform: scale(1.06); filter: saturate(1) contrast(1.06); }
  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 0%, rgba(4,4,7,0) 46%, rgba(4,4,7,0.58) 76%, rgba(4,4,7,0.9) 100%);
  }
  .copy {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; gap: 3px;
    padding: 0 clamp(8px, 0.8vw, 13px) clamp(8px, 0.8vw, 12px);
    pointer-events: none; text-align: left;
  }
  .copy em {
    font-style: normal; font-size: 8px; font-weight: 600;
    letter-spacing: 0.2em; color: rgba(255,255,255,0.42);
  }
  .copy strong { font-size: clamp(11px, 0.95vw, 15px); font-weight: 700; letter-spacing: 0.02em; }
  .copy b { font-size: clamp(8px, 0.68vw, 11px); font-weight: 400; color: rgba(255,255,255,0.62); }

  /* ===== 倒影 ===== */
  .reflection {
    position: absolute;
    left: var(--x);
    top: 68%;
    width: var(--w, 12.4%);
    aspect-ratio: 4 / 3;
    z-index: 1;
    overflow: hidden;
    border-radius: 12px;
    clip-path: inset(0 round 12px);
    pointer-events: none;
    opacity: 0;
    transform: translateX(var(--mirror-push)) translateY(calc(var(--y) * -1px)) rotate(calc(var(--rot) * 1deg));
    transform-origin: 50% 0;
    transition:
      opacity 900ms cubic-bezier(0.22, 1, 0.36, 1),
      transform 900ms cubic-bezier(0.22, 1, 0.36, 1);
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.58), rgba(0,0,0,0.2) 38%, transparent 82%);
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.58), rgba(0,0,0,0.2) 38%, transparent 82%);
  }
  .deck.is-visible .reflection { opacity: 1; }
  .reflection::before {
    content: '';
    position: absolute; left: -18%; right: -18%; top: -16%; height: 70%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.14), rgba(255,255,255,0) 70%);
    filter: blur(16px); opacity: 0.58; mix-blend-mode: screen;
  }
  .reflection img {
    width: 100%; height: 100%; object-fit: cover; object-position: top center;
    transform: perspective(480px) rotateX(11deg) scaleY(-1);
    filter: saturate(0.72) brightness(0.9) contrast(0.92) blur(3px);
  }

  /* ===== 控制条（demo 专用） ===== */
  .panel {
    position: fixed; right: 22px; bottom: 22px; z-index: 60;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-radius: 12px;
    background: rgba(18,18,24,0.82); border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px); font-size: 12px; color: rgba(255,255,255,0.7);
  }
  .panel input[type="range"] { width: 130px; accent-color: #9db4ff; }

  /* reduced-motion：跳过入场动画，直接呈现终态 */
  .no-anim * { transition: none !important; }
  .no-anim .card, .no-anim .reflection { opacity: 1 !important; }
</style>
</head>
<body>
  <div class="beam"></div>
  <header class="topbar">
    <div class="logo">FOUR</div>
    <nav class="nav"><span>Home</span><span>About</span><span class="on">Portfolio</span><span>Contact</span></nav>
  </header>

  <section class="section">
    <h1 class="headline">SELECTED WORK</h1>
    <span class="tag">作品展示</span>
    <div class="deck-wrap">
      <div class="deck" id="deck"></div>
    </div>
  </section>

  <div class="panel">
    <span>卡宽 <b id="wv">12.4%</b></span>
    <input id="wr" type="range" min="9" max="16.72" step="0.1" value="12.4" />
    <span>间距 <b id="sv">7.9%</b></span>
    <input id="sr" type="range" min="6" max="11.1" step="0.1" value="7.9" />
  </div>

<script>
  // 与主项目 public/detail/*/v1/cover-43.webp 同源（file:// 相对路径）
  const WORKS = [
    { id: 'coomo-home-mini',     title: 'COOMO HOME',       meta: '家居购物小程序' },
    { id: 'smart-home-platform', title: 'COOMO HOME',       meta: '智能家居中控平台' },
    { id: 'coomo-official',      title: 'COOMO 官网',        meta: '家居品牌官网' },
    { id: 'muguan-official',     title: '慕冠家居官网',      meta: '家具品牌官网' },
    { id: 'brand-summer',        title: 'Brand 觅野',        meta: '品牌视觉系统' },
    { id: 'campaign-visual',     title: '商业活动视觉',      meta: '画册 / KV' },
    { id: 'packaging-system',    title: '运营设计',          meta: '海报视觉系统' },
    { id: 'future-chair',        title: 'Future Chair',     meta: '产品 3D 渲染' },
    { id: 'ai-poster-lab',       title: 'AI Workflow',      meta: 'ComfyUI 工作流实验' },
    { id: 'aigc-model',          title: 'Model Consistency',meta: 'AIGC 模特一致性' },
    { id: 'aigc-style',          title: 'AIGC Character',   meta: 'QQ 形象视觉设计' }
  ];
  const N = WORKS.length;           // 11
  const REST_Y = [8, -2, 3, -5, 1, -3, 7, -1, 4, -4, 2];

  const deck = document.getElementById('deck');
  let cardW = 12.4, gap = 7.9;

  function build() {
    deck.innerHTML = '';
    const startX = 3.2;
    const rotMin = -3.4, rotMax = 3.4;
    WORKS.forEach((w, i) => {
      const left = startX + i * gap;
      const rot = rotMin + (rotMax - rotMin) * (N > 1 ? i / (N - 1) : 0.5);
      const vars = {
        '--x': left + '%',
        '--w': cardW + '%',
        '--rot': rot.toFixed(2),
        '--y': REST_Y[i % REST_Y.length],
        '--z': i + 1,
        '--i': i
      };
      const img = `public/detail/${w.id}/v1/cover-43.webp`;

      const refl = document.createElement('span');
      refl.className = 'reflection';
      refl.setAttribute('aria-hidden', 'true');
      Object.entries(vars).forEach(([k, v]) => refl.style.setProperty(k, v));
      refl.style.setProperty('--mirror-push', '0px');
      refl.dataset.rot = vars['--rot']; refl.dataset.y = vars['--y']; refl.dataset.z = vars['--z'];
      refl.innerHTML = `<img src="${img}" alt="" loading="lazy" />`;

      const card = document.createElement('div');
      card.className = 'card';
      Object.entries(vars).forEach(([k, v]) => card.style.setProperty(k, v));
      card.dataset.rot = vars['--rot']; card.dataset.y = vars['--y']; card.dataset.z = vars['--z'];
      card.innerHTML = `
        <button type="button" aria-label="${w.title}">
          <img src="${img}" alt="" loading="lazy" />
          <span class="scrim"></span>
          <span class="copy">
            <em>${String(i + 1).padStart(2, '0')}</em>
            <strong>${w.title}</strong>
            <b>${w.meta}</b>
          </span>
        </button>`;
      card.addEventListener('pointerenter', () => setHover(i));
      deck.appendChild(refl);
      deck.appendChild(card);
    });
    deck.addEventListener('pointerleave', () => setHover(-1));
  }

  const PUSH = 10, PUSH_CAP = 3;
  function setHover(h) {
    const cards = deck.querySelectorAll('.card');
    const refs = deck.querySelectorAll('.reflection');
    cards.forEach((card, i) => {
      const refl = refs[i];
      const active = i === h;
      const dist = i - h;
      const push = h < 0 || active ? 0 : Math.sign(dist) * Math.min(Math.abs(dist), PUSH_CAP) * PUSH;
      const apply = (el, isRefl) => {
        el.classList.toggle('is-active', active);
        el.style.setProperty('--push', isRefl ? '0px' : push);
        el.style.setProperty('--mirror-push', push + 'px');
        el.style.setProperty('--rot', active ? 0 : el.dataset.rot);
        el.style.setProperty('--y', active ? -46 : el.dataset.y);
        if (!isRefl) {
          el.style.setProperty('--scale', active ? 1.06 : 1);
          el.style.setProperty('--z', active ? 60 : el.dataset.z);
        }
      };
      card.dataset.rot = card.dataset.rot || vars['--rot'];
      apply(card, false);
      apply(refl, true);
    });
  }

  // 控制条：实时调卡宽/间距，方便对比 7 卡原尺寸(16.72/11.1)
  const wr = document.getElementById('wr'), sr = document.getElementById('sr');
  const wv = document.getElementById('wv'), sv = document.getElementById('sv');
  function rebuild() {
    cardW = parseFloat(wr.value); gap = parseFloat(sr.value);
    wv.textContent = cardW + '%'; sv.textContent = gap + '%';
    build();
    requestAnimationFrame(() => deck.classList.add('is-visible'));
    setHover(-1);
  }
  wr.addEventListener('input', rebuild);
  sr.addEventListener('input', rebuild);

  build();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('no-anim');
    deck.classList.add('is-visible');
  } else {
    requestAnimationFrame(() => requestAnimationFrame(() => deck.classList.add('is-visible')));
  }
</script>
</body>
</html>
