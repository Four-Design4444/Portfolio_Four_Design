<!DOCTYPE html>
<html lang="zh-CN" data-ratio="4x3">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PC 二级页 DEMO · 主卡 4:3</title>
<style>
/* ===========================================================================
   PC 二级页（works orbit）比例对照 demo —— 独立文件，不接入主项目
   几何 / 材质 / 动效 1:1 复刻 src/styles.css 4711-5452 段 + src/components/SideRays.jsx
   唯一改动：主卡封面 .wo-cover 及其镜面倒影由 16/9 换成 4/3
   （高度上限 min(58vh,470px) 与现状完全相同，所以版式纵向节奏零变化）
   =========================================================================== */

/* --- 可切换变量：ratio 决定封面上限宽度如何随高度换算 --- */
html[data-ratio="16x9"] { --rw: 16; --rh: 9; }
html[data-ratio="4x3"]  { --rw: 4;  --rh: 3; }

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #0d0c12;
  color: #e9edf4;
  font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; }

/* ============================ 页面框架 ============================ */
.works-index-page--orbit {
  position: relative;
  min-height: 100vh;
  /* 顶部额外让出固定导航（36+62px）的高度 */
  padding: clamp(108px, 12.5vh, 122px) clamp(24px, 2.3vw, 44px) clamp(24px, 2.3vw, 40px);
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(circle at 82% 0%, rgba(150, 200, 255, 0.16), transparent 30rem),
    radial-gradient(circle at 64% 24%, rgba(234, 179, 8, 0.05), transparent 20rem),
    #0d0c12;
  overflow: clip;
}

/* 纵深暗角 */
.works-index-page--orbit::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  background: radial-gradient(ellipse 115% 92% at 50% 44%,
    transparent 40%,
    rgba(5, 8, 15, 0.32) 72%,
    rgba(3, 5, 10, 0.58) 100%);
}

.works-side-rays {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100vw;
  height: 100vh;
  opacity: 1;
  mix-blend-mode: screen;
  pointer-events: none;
  mask-image: linear-gradient(180deg, black 0%, black 82%, transparent 100%);
  -webkit-mask-image: linear-gradient(180deg, black 0%, black 82%, transparent 100%);
}

.works-container {
  position: relative;
  z-index: 1;
  width: 100%;
  margin: 0;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ============================ 顶部导航 ============================ */
.morph-nav {
  position: fixed;
  top: var(--nav-floating-top, 36px);
  left: 50%;
  z-index: 40;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  width: min(1430px, calc(100% - 160px));
  height: 62px;
  padding: 0 28px;
  border: 0;
  border-radius: 999px;
  background: rgba(183, 208, 250, 0.024);
  -webkit-backdrop-filter: blur(24px) saturate(120%);
  backdrop-filter: blur(24px) saturate(120%);
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.06);
  transform: translate3d(-50%, 0, 0);
  isolation: isolate;
  contain: paint;
  --nav-item-width: 128px;
  --nav-item-gap: 14px;
  --works-group-width: calc((var(--nav-item-width) * 4) + (var(--nav-item-gap) * 3));
  --works-nav-height: 36px;
  --nav-border-color: rgba(214, 229, 255, 0.09);
}

.morph-nav::before {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid var(--nav-border-color);
  border-radius: inherit;
  pointer-events: none;
}

.morph-logo {
  grid-column: 1;
  justify-self: start;
  padding: 0;
  width: 75px;
  height: 22px;
  border: 0;
  background: transparent;
  cursor: pointer;
}
.morph-logo img { width: 75px; height: 22px; display: block; }

.works-nav-items {
  position: relative;
  grid-column: 2;
  grid-row: 1;
  display: grid;
  grid-template-columns: repeat(4, var(--nav-item-width));
  column-gap: var(--nav-item-gap);
  justify-self: center;
  align-items: center;
  width: var(--works-group-width);
}

.works-nav-items button {
  position: relative;
  z-index: 2;
  width: var(--nav-item-width);
  min-width: 0;
  height: var(--works-nav-height);
  padding: 0 22px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  font-size: 13px;
  line-height: 1;
  color: rgba(233, 239, 244, 0.62);
  cursor: pointer;
  transition: color 260ms ease;
}
.works-nav-items button.active { color: #e9edf4; }

.works-nav-indicator {
  position: absolute;
  z-index: 1;
  left: 0;
  top: 50%;
  margin-top: calc(var(--works-nav-height) / -2);
  width: var(--nav-item-width);
  height: var(--works-nav-height);
  border-radius: 999px;
  background: linear-gradient(145deg, rgba(228, 239, 255, 0.13), rgba(145, 177, 226, 0.06));
  box-shadow:
    inset 0 0 0 1px rgba(219, 234, 255, 0.13),
    inset 0 1px 0 rgba(239, 247, 255, 0.09),
    0 8px 22px rgba(0, 0, 0, 0.28);
  transform: translateX(calc(var(--active-index) * (var(--nav-item-width) + var(--nav-item-gap))));
  transition: transform 430ms cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}

/* ============================ 导航右侧：比例切换（demo 专用） ============================ */
.ratio-switch {
  grid-column: 3;
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px 6px 12px;
  border: 1px solid rgba(214, 229, 255, 0.12);
  border-radius: 999px;
  background: rgba(10, 16, 28, 0.42);
  font-size: 9px;
  letter-spacing: 1.2px;
  color: #979eac;
}
.ratio-switch b { color: #c8d6ef; font-weight: 500; }
.ratio-switch button {
  border: 0;
  border-radius: 999px;
  padding: 6px 13px;
  background: transparent;
  font-size: 10px;
  letter-spacing: 0.6px;
  color: rgba(233, 239, 244, 0.6);
  cursor: pointer;
  transition: background 0.3s, color 0.3s;
}
.ratio-switch button[aria-pressed="true"] {
  background: linear-gradient(145deg, rgba(228, 239, 255, 0.16), rgba(145, 177, 226, 0.07));
  box-shadow: inset 0 0 0 1px rgba(219, 234, 255, 0.16);
  color: #fff;
}

/* ============================ 展台 ============================ */
.works-orbit-stage {
  flex: 1;
  min-height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 0 16px;
}

.works-orbit {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 270px;
  column-gap: clamp(42px, 4.7vw, 72px);
  align-items: center;
}

.works-orbit-focus {
  position: relative;
  min-width: 0;
  isolation: isolate;
  /* 下方留白写成变量：地面要按"卡片底边"定位，必须减掉这段 padding */
  --focus-pb: 64px;
  padding: 18px 0 var(--focus-pb);
}

/* 慢速悬浮 */
.works-orbit-float {
  position: relative;
  z-index: 3;
  animation: works-orbit-bob 7.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  will-change: transform;
}
@keyframes works-orbit-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* ---- 主卡 ---- */
.works-orbit-card {
  position: relative;
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px;
  border: 1px solid rgba(205, 225, 255, 0.21);
  border-radius: 15px;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(132deg, rgba(231, 242, 255, 0.11), rgba(186, 203, 232, 0.043) 33%, rgba(185, 201, 224, 0.03) 70%, rgba(219, 234, 255, 0.075));
  box-shadow:
    inset 0 0 0 1px rgba(244, 250, 255, 0.02),
    inset 0 1px 1px rgba(244, 250, 255, 0.07),
    inset 0 -1px 1px rgba(9, 19, 33, 0.53),
    0 18px 36px -24px rgba(0, 0, 0, 0.68);
  backdrop-filter: blur(28px) saturate(125%);
  -webkit-backdrop-filter: blur(28px) saturate(125%);
  transform: perspective(1300px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform 0.48s cubic-bezier(0.23, 0.76, 0.25, 1), box-shadow 0.48s cubic-bezier(0.23, 0.76, 0.25, 1), border-color 0.4s;
  cursor: pointer;
}
.works-orbit-card:hover,
.works-orbit-card:focus-visible {
  transform: perspective(1300px) translateY(-14px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(1.025);
  border-color: rgba(210, 232, 255, 0.46);
  box-shadow:
    inset 0 1px 1px rgba(244, 250, 255, 0.14),
    0 31px 48px -22px rgba(0, 0, 0, 0.87),
    0 0 25px -19px rgba(164, 204, 255, 0.33);
}

.works-orbit-edge {
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(215, 234, 255, 0.043);
  border-radius: 15px;
  pointer-events: none;
  box-shadow: inset 1px 1px 2px rgba(245, 252, 255, 0.027), inset -1px -1px 2px rgba(8, 13, 23, 0.2);
}

.works-orbit-clip {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: inherit;
  pointer-events: none;
  z-index: 2;
}

/* 斜向扫光 */
.works-orbit-sheen {
  position: absolute;
  inset: -160% -110%;
  opacity: 0;
  background: linear-gradient(112deg, transparent 34%, rgba(230, 244, 255, 0) 39%, rgba(230, 244, 255, 0.03) 44%, rgba(242, 250, 255, 0.15) 49%, rgba(230, 244, 255, 0.03) 54%, rgba(230, 244, 255, 0) 59%, transparent 64%);
  filter: blur(13px);
  transform: translateX(-40%);
  mix-blend-mode: screen;
}
.works-orbit-card:hover .works-orbit-sheen,
.works-orbit-rail-card:hover .works-orbit-sheen {
  animation: works-orbit-sweep 1250ms cubic-bezier(0.25, 0.5, 0.3, 1);
}
@keyframes works-orbit-sweep {
  0% { opacity: 0; transform: translateX(-40%); }
  22% { opacity: 0.8; transform: translateX(-23%); }
  65% { opacity: 0.72; transform: translateX(17%); }
  100% { opacity: 0; transform: translateX(40%); }
}

/* 指针跟随光斑 */
.works-orbit-glow {
  position: absolute;
  inset: -35px;
  opacity: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 210px 130px at var(--mx, 50%) var(--my, 50%), rgba(212, 234, 255, 0.086), transparent 80%);
  filter: blur(16px);
  transition: opacity 0.4s;
  mix-blend-mode: screen;
}
.works-orbit-card:hover .works-orbit-glow,
.works-orbit-rail-card:hover .works-orbit-glow { opacity: 1; }

/* ★ 唯一改动点：封面比例 16/9 → 4/3
   高度上限 min(58vh,470px) 与现状一致；宽度上限按当前比例反推，保证纵向节奏不变。 */
.works-orbit-cover {
  position: relative;
  width: 100%;
  max-width: min(96%, calc(min(58vh, 470px) * var(--rw) / var(--rh)));
  margin: 0 auto;
  aspect-ratio: var(--rw) / var(--rh);
  max-height: min(58vh, 470px);
  overflow: hidden;
  border-radius: 6px;
  background: #101724;
  box-shadow: 0 0 0 1px rgba(241, 247, 255, 0.055), 0 4px 14px rgba(0, 0, 0, 0.2);
  isolation: isolate;
  z-index: 1;
}
.works-orbit-cover > img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: translate(var(--px, 0px), var(--py, 0px)) scale(1.015);
  transition: transform 0.75s cubic-bezier(0.23, 0.76, 0.25, 1), filter 0.45s;
  filter: brightness(0.96);
}
.works-orbit-card:hover .works-orbit-cover > img,
.works-orbit-card:focus-visible .works-orbit-cover > img {
  filter: brightness(1.02);
  transform: translate(var(--px, 0px), var(--py, 0px)) scale(1.09);
}

/* hover 出现的 OPEN PROJECT 胶囊 */
.works-orbit-peek {
  position: absolute;
  z-index: 3;
  bottom: 11px;
  right: 11px;
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid rgba(237, 248, 255, 0.21);
  border-radius: 30px;
  background: rgba(23, 35, 51, 0.69);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 9px 13px;
  color: #f3f7ff;
  font-size: 8px;
  letter-spacing: 1px;
  opacity: 0;
  transform: translateY(9px);
  transition: opacity 0.3s, transform 0.4s cubic-bezier(0.23, 0.76, 0.25, 1);
}
.works-orbit-card:hover .works-orbit-peek,
.works-orbit-card:focus-visible .works-orbit-peek { opacity: 1; transform: translateY(0); }

/* ---- 镜面地面 ---- */
.works-orbit-floor {
  position: absolute;
  /* 13px = 卡片 12px padding + 1px border：让地面左/右边界正好等于 cover 可用宽度 */
  left: 13px;
  right: 13px;
  top: calc(100% - var(--focus-pb) - 13px);
  height: clamp(260px, 46vh, 560px);
  overflow: hidden;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.68) 42%, rgba(0, 0, 0, 0.26) 72%, transparent 96%);
  mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.68) 42%, rgba(0, 0, 0, 0.26) 72%, transparent 96%);
}
.works-orbit-floor::before {
  content: '';
  position: absolute;
  left: -13px;
  right: -13px;
  top: 0;
  height: 64px;
  background:
    linear-gradient(180deg, rgba(196, 220, 255, 0.055), transparent 55%),
    radial-gradient(ellipse 90% 100% at 50% 0%, rgba(150, 190, 255, 0.045), transparent 78%);
  filter: blur(1px);
  z-index: 3;
}
.works-orbit-floor::after {
  content: '';
  position: absolute;
  left: 10%;
  right: 10%;
  top: 1px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(ellipse 50% 50% at 50% 42%, rgba(2, 5, 11, 0.5), rgba(2, 5, 11, 0.2) 58%, transparent 80%);
  filter: blur(6px);
  z-index: 3;
  transition: opacity 0.48s cubic-bezier(0.23, 0.76, 0.25, 1), transform 0.48s cubic-bezier(0.23, 0.76, 0.25, 1);
}
.works-orbit-float:hover ~ .works-orbit-floor::after { opacity: 0.5; transform: scaleX(1.05) translateY(3px); }

/* ★ 同步改动：倒影盒子必须与 cover 完全同尺寸才能 1:1 对齐 */
.works-orbit-floor-mirror {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  margin-inline: auto;
  width: auto;
  max-width: min(96%, calc(min(58vh, 470px) * var(--rw) / var(--rh)));
  aspect-ratio: var(--rw) / var(--rh);
  max-height: min(58vh, 470px);
  translate: 0 var(--bob-mirror, 0px);
  transform: perspective(1300px) translateY(var(--lift, 0px))
             rotateX(calc(var(--rx, 0deg) * -1)) rotateY(var(--ry, 0deg))
             scale(var(--mz, 1)) scaleY(-1);
  transition: transform 0.48s cubic-bezier(0.23, 0.76, 0.25, 1);
  animation: works-orbit-bob-mirror 7.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  will-change: transform;
  z-index: 2;
}
.works-orbit-float:hover ~ .works-orbit-floor .works-orbit-floor-mirror,
.works-orbit-float:has(.works-orbit-card:focus-visible) ~ .works-orbit-floor .works-orbit-floor-mirror {
  --lift: 14px;
  --mz: 1.025;
}
@keyframes works-orbit-bob-mirror {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 6px; }
}
.works-orbit-floor-mirror img {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: translate(var(--px, 0px), var(--py, 0px)) scale(1.015);
  transition: transform 0.75s cubic-bezier(0.23, 0.76, 0.25, 1);
}
.works-orbit-float:hover ~ .works-orbit-floor .works-orbit-floor-mirror img,
.works-orbit-float:has(.works-orbit-card:focus-visible) ~ .works-orbit-floor .works-orbit-floor-mirror img {
  transform: translate(var(--px, 0px), var(--py, 0px)) scale(1.09);
}
.works-orbit-floor-mirror-near {
  filter: blur(0.7px) brightness(0.72) saturate(1.06);
  opacity: 0.95;
  -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.5) 28%, rgba(0, 0, 0, 0.16) 52%, transparent 72%);
  mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.5) 28%, rgba(0, 0, 0, 0.16) 52%, transparent 72%);
}
.works-orbit-floor-mirror-far {
  filter: blur(12px) brightness(0.38) saturate(1.02);
  opacity: 0.62;
  -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.34) 46%, transparent 100%);
  mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.34) 46%, transparent 100%);
}

/* ---- 右侧索引 rail ---- */
.works-orbit-rail {
  display: flex;
  flex-direction: column;
  gap: 7px;
  align-self: center;
  position: relative;
  padding-bottom: 30px;
}
@supports (-webkit-box-reflect: below 0) {
  .works-orbit-rail {
    -webkit-box-reflect: below 3px linear-gradient(to bottom, rgba(0, 0, 0, 0.16), transparent 30%);
  }
}
.works-orbit-rail-label {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  letter-spacing: 1.4px;
  color: rgba(233, 239, 244, 0.55);
  margin-bottom: 7px;
}
.works-orbit-rail-card {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  border: 1px solid rgba(205, 225, 255, 0.078);
  border-radius: 13px;
  background: rgba(183, 208, 250, 0.012);
  padding: 10px;
  backdrop-filter: blur(20px) saturate(120%);
  -webkit-backdrop-filter: blur(20px) saturate(120%);
  box-shadow: 0 18px 32px -24px rgba(0, 0, 0, 0.72);
  cursor: pointer;
  transition: background 0.4s cubic-bezier(0.23, 0.76, 0.25, 1), transform 0.4s cubic-bezier(0.23, 0.76, 0.25, 1), border-color 0.4s, box-shadow 0.4s;
  animation: works-orbit-rail-bob 8.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  animation-delay: calc(var(--i, 0) * -1.6s);
}
@keyframes works-orbit-rail-bob {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -3px; }
}
.works-orbit-rail-card .works-orbit-sheen { inset: -260% -110%; }
.works-orbit-rail-card .works-orbit-glow {
  inset: 0;
  background: radial-gradient(ellipse 140px 75px at var(--mx, 50%) var(--my, 50%), rgba(212, 234, 255, 0.14), transparent 80%);
  filter: blur(10px);
}
.works-orbit-rail-card .works-orbit-cover {
  width: 76px;
  flex: 0 0 76px;
  max-width: none;
  max-height: none;
  border-radius: 5px;
}
.works-orbit-rail-card .works-orbit-cover > img { transform: none; filter: brightness(0.88); }
.works-orbit-rail-copy {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1;
}
.works-orbit-rail-copy > span:first-child { font-size: 9px; color: rgba(233, 239, 244, 0.55); }
.works-orbit-rail-copy > div { min-width: 0; }
.works-orbit-rail-copy h3 {
  font-size: 11px;
  letter-spacing: 0.35px;
  font-weight: 500;
  margin: 0 0 5px;
  color: #e9edf4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.works-orbit-rail-copy p {
  font-size: 10px;
  color: rgba(233, 239, 244, 0.55);
  margin: 0;
  white-space: nowrap;
}
.works-orbit-rail-arrow {
  margin-left: auto;
  opacity: 0;
  transform: translateX(-5px);
  transition: opacity 0.3s, transform 0.3s;
  color: #e9edf4;
}
.works-orbit-rail-card.is-selected {
  background: linear-gradient(135deg, rgba(223, 239, 255, 0.11), rgba(176, 204, 240, 0.043));
  border-color: rgba(216, 235, 255, 0.27);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.063), 0 22px 38px -20px rgba(0, 0, 0, 0.78), 0 0 26px -18px rgba(164, 204, 255, 0.35);
  transform: translateX(-7px);
}
.works-orbit-rail-card.is-selected::before {
  content: "";
  position: absolute;
  z-index: 3;
  left: 0;
  height: 19px;
  width: 2px;
  background: #b8d3f7;
  border-radius: 2px;
}
.works-orbit-rail-card.is-selected .works-orbit-cover > img { filter: brightness(1); }
.works-orbit-rail-card.is-selected .works-orbit-rail-arrow,
.works-orbit-rail-card:hover .works-orbit-rail-arrow { opacity: 1; transform: translateX(0); }
.works-orbit-rail-card:hover:not(.is-selected) {
  background: rgba(213, 231, 255, 0.047);
  transform: translateX(-3px) translateY(-2px);
  border-color: rgba(216, 235, 255, 0.15);
  box-shadow: 0 26px 42px -24px rgba(0, 0, 0, 0.8), 0 0 22px -18px rgba(164, 204, 255, 0.3);
}

/* ---- 底部信息行 + 页脚 ---- */
.works-orbit-stage-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 22px;
  position: relative;
  z-index: 7;
}
.works-orbit-collection-label {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #979eac;
  font-size: 8px;
  letter-spacing: 1px;
}
.works-orbit-dot { display: block; width: 4px; height: 4px; border-radius: 50%; background: #b8d3f7; }
.works-orbit-divider { opacity: 0.35; padding: 0 2px; }
.works-orbit-hint {
  display: flex;
  align-items: center;
  gap: 16px;
  color: #979eac;
  font-size: 7px;
  letter-spacing: 1.5px;
}
.works-orbit-hint-line { height: 1px; width: 44px; background: rgba(197, 216, 245, 0.11); }
.works-orbit-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 28px;
  border-top: 1px solid rgba(197, 216, 245, 0.11);
  padding-top: 20px;
  color: #979eac;
  font-size: 8px;
  letter-spacing: 0.3px;
  position: relative;
  z-index: 7;
}
.works-orbit-footer-right {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 7px;
  letter-spacing: 1.1px;
}
.works-orbit-version-tag {
  padding: 5px 9px;
  border: 1px solid rgba(197, 216, 245, 0.11);
  border-radius: 12px;
  color: #c1cee0;
  letter-spacing: 0.6px;
}

/* ---- 读数条（demo 专用，方便核验比例） ---- */
.ratio-readout {
  position: fixed;
  z-index: 60;
  left: 18px;
  bottom: 18px;
  padding: 10px 13px;
  border: 1px solid rgba(214, 229, 255, 0.12);
  border-radius: 10px;
  background: rgba(8, 12, 22, 0.6);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  font-size: 10px;
  line-height: 1.7;
  color: #9fb0c9;
  font-variant-numeric: tabular-nums;
}
.ratio-readout b { color: #e9edf4; font-weight: 500; }
.ratio-readout .rd-ok { color: #8fd6a4; }

@media (max-width: 1280px) {
  .works-orbit { grid-template-columns: minmax(0, 1fr) 235px; column-gap: 38px; }
  .works-orbit-rail-card .works-orbit-cover { width: 62px; flex-basis: 62px; }
  .works-orbit-rail-arrow { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .works-orbit-card:hover, .works-orbit-card:focus-visible { transform: none; }
  .works-orbit-sheen { display: none; }
  .works-orbit-float, .works-orbit-rail-card, .works-orbit-floor-mirror { animation: none; translate: none; }
  .works-orbit-floor-mirror { transform: scaleY(-1); }
}
</style>
</head>
<body>

<header class="morph-nav" id="nav" style="--active-index: 0">
  <button type="button" class="morph-logo" aria-label="FOUR Home">
    <img src="/src/assets/four-logo.svg" alt="FOUR" />
  </button>
  <nav class="works-nav-items" id="navItems">
    <span class="works-nav-indicator" aria-hidden="true"></span>
  </nav>
  <div class="ratio-switch" role="group" aria-label="主卡比例">
    <b>主卡比例</b>
    <button type="button" data-ratio-set="16x9" aria-pressed="false">16:9</button>
    <button type="button" data-ratio-set="4x3" aria-pressed="true">4:3</button>
  </div>
</header>

<section class="works-index-page works-index-page--orbit">
  <div class="works-side-rays" id="rays"></div>
  <div class="works-container">
    <div class="works-orbit-stage">
      <div class="works-orbit">
        <div class="works-orbit-focus" id="focus">
          <div class="works-orbit-float">
            <button type="button" class="works-orbit-card" id="card" aria-label="查看作品">
              <span class="works-orbit-edge" aria-hidden="true"></span>
              <span class="works-orbit-clip" aria-hidden="true">
                <span class="works-orbit-sheen"></span>
                <span class="works-orbit-glow"></span>
              </span>
              <div class="works-orbit-cover" id="cover">
                <img id="coverImg" src="" alt="" />
                <span class="works-orbit-peek"><span>OPEN PROJECT</span>
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19L19 5M5 5h14v14" /></svg>
                </span>
              </div>
            </button>
          </div>
          <div class="works-orbit-floor" aria-hidden="true">
            <div class="works-orbit-floor-mirror">
              <img class="works-orbit-floor-mirror-far" id="mirrorFar" src="" alt="" />
              <img class="works-orbit-floor-mirror-near" id="mirrorNear" src="" alt="" />
            </div>
          </div>
        </div>

        <div class="works-orbit-rail" id="rail">
          <div class="works-orbit-rail-label">IN THIS COLLECTION <span id="railCount">00</span></div>
        </div>
      </div>
    </div>

    <div class="works-orbit-stage-meta">
      <div class="works-orbit-collection-label">
        <span class="works-orbit-dot"></span>
        <span id="catCn">UI 设计</span>
        <span class="works-orbit-divider">/</span>
        <span><span id="countText">00</span> PROJECTS</span>
      </div>
      <span class="works-orbit-hint">HOVER TO FOCUS<span class="works-orbit-hint-line" /></span>
    </div>
    <footer class="works-orbit-footer">
      <span>移入右侧索引切换作品，移入主卡探索光与视角。方向键同样可切换。</span>
      <span class="works-orbit-footer-right">
        <span id="ratioLabel">4:3</span> <span class="works-orbit-divider">/</span> SINGLE SCREEN
        <span class="works-orbit-version-tag">DEMO</span>
      </span>
    </footer>
  </div>
</section>

<div class="ratio-readout" id="readout"></div>

<script>
/* ============================== 数据 ============================== */
const categories = [
  { id: 'ui',   title: 'UI Design',  cn: 'UI 设计' },
  { id: 'vi',   title: 'VI Design',  cn: 'VI 设计' },
  { id: '3d',   title: '3D Design',  cn: '3D 设计' },
  { id: 'aigc', title: 'AIGC',       cn: 'AIGC' }
];

const worksByCategory = {
  ui: [
    { id: 'coomo-home-mini',      title: 'COOMO HOME',  subtitle: '家居购物小程序',   image: '/public/detail/coomo-home-mini/v1/cover-portrait.webp',      detailHero: '/public/detail/coomo-home-mini/v1/cover.webp' },
    { id: 'smart-home-platform',  title: 'COOMO HOME',  subtitle: '智能家居中控平台', image: '/public/detail/smart-home-platform/v1/cover-portrait.webp',  detailHero: '/public/detail/smart-home-platform/v1/cover.webp' },
    { id: 'coomo-official',       title: 'COOMO 官网',   subtitle: '家居品牌官网',     image: '/public/detail/coomo-official/v1/cover-portrait.webp',       detailHero: '/public/detail/coomo-official/v1/cover.webp' },
    { id: 'muguan-official',      title: '慕冠家居官网', subtitle: '家具品牌官网',     image: '/public/detail/muguan-official/v1/cover-portrait.webp',      detailHero: '/public/detail/muguan-official/v1/cover.webp' }
  ],
  vi: [
    { id: 'brand-summer',    title: 'Brand 觅野',     subtitle: '品牌视觉系统',   image: '/public/detail/brand-summer/v1/cover-portrait.webp',    detailHero: '/public/detail/brand-summer/v1/cover.webp' },
    { id: 'campaign-visual', title: '商业活动视觉',   subtitle: '画册 / KV',      image: '/public/detail/campaign-visual/v1/cover-portrait.webp', detailHero: '/public/detail/campaign-visual/v1/cover.webp' },
    { id: 'packaging-system',title: '运营设计',       subtitle: '海报视觉系统',   image: '/public/detail/packaging-system/v1/cover-portrait.webp',detailHero: '/public/detail/packaging-system/v1/cover.webp' }
  ],
  '3d': [
    { id: 'future-chair', title: 'Future Chair', subtitle: '产品 3D 渲染', image: '/public/detail/future-chair/v1/cover-portrait.webp', detailHero: '/public/detail/future-chair/v1/cover.webp' }
  ],
  aigc: [
    { id: 'ai-poster-lab', title: 'AI Workflow',      subtitle: 'ComfyUI 工作流实验', image: '/public/detail/ai-poster-lab/v1/cover-portrait.webp', detailHero: '/public/detail/ai-poster-lab/v1/cover.webp' },
    { id: 'aigc-model',     title: 'Model Consistency', subtitle: 'AIGC 模特一致性',   image: '/public/detail/aigc-model/v1/cover-portrait.webp',     detailHero: '/public/detail/aigc-model/v1/cover.webp' },
    { id: 'aigc-style',     title: 'AIGC Character',   subtitle: 'QQ 形象视觉设计',   image: '/public/detail/aigc-style/v1/cover-portrait.webp',     detailHero: '/public/detail/aigc-style/v1/cover.webp' }
  ]
};

const ORBIT_AUTO_DELAY = 4000;
const root = document.documentElement;
const $ = (id) => document.getElementById(id);

const elNav = $('nav');
const elNavItems = $('navItems');
const elFocus = $('focus');
const elCard = $('card');
const elCover = $('cover');
const elCoverImg = $('coverImg');
const elMirrorFar = $('mirrorFar');
const elMirrorNear = $('mirrorNear');
const elRail = $('rail');
const elCatCn = $('catCn');
const elCountText = $('countText');
const elRailCount = $('railCount');
const elReadout = $('readout');

const arrowSvg = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19L19 5M5 5h14v14" /></svg>';

let activeCategoryIndex = 0;
let index = 0;
let autoTimer = null;
let railHover = false;

/* ============================== 导航胶囊 ============================== */
categories.forEach((category, i) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.dataset.categoryPill = category.id;
  btn.className = i === 0 ? 'active' : '';
  btn.textContent = category.title;
  btn.setAttribute('aria-label', category.title);
  btn.addEventListener('click', () => setCategory(i));
  elNavItems.appendChild(btn);
});
const navButtons = Array.from(elNavItems.querySelectorAll('button'));

function setCategory(i) {
  activeCategoryIndex = i;
  index = 0;
  navButtons.forEach((b, k) => b.classList.toggle('active', k === i));
  elNav.style.setProperty('--active-index', i);
  buildRail();
  render();
  startAuto();
}

/* ============================== 右侧索引 ============================== */
function buildRail() {
  const works = worksByCategory[categories[activeCategoryIndex].id];
  elRail.querySelectorAll('.works-orbit-rail-card').forEach((n) => n.remove());
  elRailCount.textContent = String(works.length).padStart(2, '0');
  elCountText.textContent = String(works.length).padStart(2, '0');
  elCatCn.textContent = categories[activeCategoryIndex].cn;

  works.forEach((work, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'works-orbit-rail-card' + (i === index ? ' is-selected' : '');
    btn.style.setProperty('--i', i);
    btn.setAttribute('aria-label', '选择 ' + work.title);
    btn.innerHTML =
      '<span class="works-orbit-clip" aria-hidden="true"><span class="works-orbit-sheen"></span><span class="works-orbit-glow"></span></span>' +
      '<div class="works-orbit-cover"><img src="' + work.image + '" alt="' + work.subtitle + '" /></div>' +
      '<div class="works-orbit-rail-copy">' +
        '<span>' + String(i + 1).padStart(2, '0') + '</span>' +
        '<div><h3>' + work.title + '</h3><p>' + work.subtitle + '</p></div>' +
        '<span class="works-orbit-rail-arrow">' + arrowSvg + '</span>' +
      '</div>';
    btn.addEventListener('pointerenter', () => { setIndex(i); });
    btn.addEventListener('click', () => setIndex(i));
    elRail.appendChild(btn);
  });
}

elRail.addEventListener('pointerenter', () => { railHover = true; stopAuto(); });
elRail.addEventListener('pointerleave', () => { railHover = false; startAuto(); });

/* ============================== 主卡 ============================== */
function current() {
  return worksByCategory[categories[activeCategoryIndex].id][index];
}

function setIndex(i) {
  const works = worksByCategory[categories[activeCategoryIndex].id];
  const next = Math.min(works.length - 1, Math.max(0, i));
  if (next === index) return;
  index = next;
  elRail.querySelectorAll('.works-orbit-rail-card').forEach((card, k) => {
    card.classList.toggle('is-selected', k === index);
  });
  render();
}

function render() {
  const work = current();
  elCoverImg.src = work.detailHero;
  elCoverImg.alt = work.title;
  elMirrorFar.src = work.detailHero;
  elMirrorNear.src = work.detailHero;
  elCard.setAttribute('aria-label', '查看 ' + work.title);
  updateReadout();
}

/* 指针视差：只写 CSS 变量，动效交给 CSS transition */
elCard.addEventListener('pointermove', (event) => {
  const box = elCard.getBoundingClientRect();
  const px = Math.max(-0.5, Math.min(0.5, (event.clientX - box.left) / box.width - 0.5));
  const py = Math.max(-0.5, Math.min(0.5, (event.clientY - box.top) / box.height - 0.5));
  elFocus.style.setProperty('--rx', (-py * 8) + 'deg');
  elFocus.style.setProperty('--ry', (px * 11) + 'deg');
  elFocus.style.setProperty('--px', (-px * 12) + 'px');
  elFocus.style.setProperty('--py', (-py * 9) + 'px');
  elCard.style.setProperty('--mx', (px + 0.5) * 100 + '%');
  elCard.style.setProperty('--my', (py + 0.5) * 100 + '%');
});
elCard.addEventListener('pointerleave', () => {
  ['--rx', '--ry', '--px', '--py'].forEach((k) => elFocus.style.removeProperty(k));
});

window.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowRight') { step(1); }
  else if (event.key === 'ArrowLeft') { step(-1); }
  else return;
  event.preventDefault();
});

function step(delta) {
  const works = worksByCategory[categories[activeCategoryIndex].id];
  setIndex((index + delta + works.length) % works.length);
  restartAuto();
}

function startAuto() {
  stopAuto();
  if (railHover) return;
  autoTimer = window.setInterval(() => {
    const works = worksByCategory[categories[activeCategoryIndex].id];
    setIndex((index + 1) % works.length);
  }, ORBIT_AUTO_DELAY);
}
function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
function restartAuto() { stopAuto(); startAuto(); }
elCard.addEventListener('pointerenter', stopAuto);
elCard.addEventListener('pointerleave', startAuto);

/* ============================== 比例切换（demo 专用） ============================== */
document.querySelectorAll('[data-ratio-set]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const value = btn.dataset.ratioSet;
    root.dataset.ratio = value;
    document.querySelectorAll('[data-ratio-set]').forEach((b) => {
      b.setAttribute('aria-pressed', String(b === btn));
    });
    $('ratioLabel').textContent = value === '4x3' ? '4:3' : '16:9';
    requestAnimationFrame(updateReadout);
  });
});

/* ============================== 读数 ============================== */
function updateReadout() {
  const rw = parseFloat(getComputedStyle(root).getPropertyValue('--rw'));
  const rh = parseFloat(getComputedStyle(root).getPropertyValue('--rh'));
  const box = elCover.getBoundingClientRect();
  const mirror = document.querySelector('.works-orbit-floor-mirror').getBoundingClientRect();
  const measured = box.width / box.height;
  const target = rw / rh;
  const ok = Math.abs(measured - target) < 0.01;
  elReadout.innerHTML =
    '封面 CSS: aspect-ratio ' + rw + ' / ' + rh + '<br>' +
    '实测 cover: <b>' + box.width.toFixed(1) + ' × ' + box.height.toFixed(1) + '</b> = <b>' + measured.toFixed(3) + '</b> ' +
    '<span class="' + (ok ? 'rd-ok' : '') + '">' + (ok ? '✓' : '✗') + '</span><br>' +
    '倒影 mirror: <b>' + mirror.width.toFixed(1) + ' × ' + mirror.height.toFixed(1) + '</b>（与封面同尺寸）<br>' +
    '视口: <b>' + window.innerWidth + ' × ' + window.innerHeight + '</b>　一屏滚动条: <b>' +
    (document.documentElement.scrollHeight > window.innerHeight + 1 ? '有 ✗' : '无 ✓') + '</b>';
}
window.addEventListener('resize', updateReadout);

/* ============================== SideRays（原生 WebGL，参数同项目） ============================== */
(function initRays() {
  const host = $('rays');
  const canvas = document.createElement('canvas');
  const gl = canvas.getContext('webgl', { alpha: true, antialias: false, premultipliedAlpha: true });
  if (!gl) return;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  host.appendChild(canvas);

  const vert = 'attribute vec2 position; void main(){ gl_Position = vec4(position, 0.0, 1.0); }';
  const frag = [
    'precision highp float;',
    'uniform float iTime; uniform vec2 iResolution; uniform float iSpeed;',
    'uniform vec3 iRayColor1; uniform vec3 iRayColor2;',
    'uniform float iIntensity; uniform float iSpread; uniform float iTilt;',
    'uniform float iSaturation; uniform float iBlend; uniform float iFalloff; uniform float iOpacity;',
    'float rayStrength(vec2 raySource, vec2 rayRefDirection, vec2 coord, float seedA, float seedB, float speed) {',
    '  vec2 sourceToCoord = coord - raySource;',
    '  float cosAngle = dot(normalize(sourceToCoord), rayRefDirection);',
    '  return clamp((0.45 + 0.15 * sin(cosAngle * seedA + iTime * speed)) + (0.3 + 0.2 * cos(-cosAngle * seedB + iTime * speed)), 0.0, 1.0) *',
    '    clamp((iResolution.x - length(sourceToCoord)) / iResolution.x, 0.5, 1.0);',
    '}',
    'void main() {',
    '  vec2 fragCoord = gl_FragCoord.xy;',
    '  vec2 coord = vec2(fragCoord.x, iResolution.y - fragCoord.y);',
    '  vec2 rayPos = vec2(iResolution.x * 1.1, -0.5 * iResolution.y);',
    '  float tiltRad = iTilt * 3.14159265 / 180.0;',
    '  float cs = cos(tiltRad); float sn = sin(tiltRad);',
    '  vec2 rel = coord - rayPos;',
    '  vec2 tiltedCoord = vec2(rel.x * cs - rel.y * sn, rel.x * sn + rel.y * cs) + rayPos;',
    '  float halfSpread = iSpread * 0.275;',
    '  vec2 rayRefDir1 = normalize(vec2(cos(0.785398 + halfSpread), sin(0.785398 + halfSpread)));',
    '  vec2 rayRefDir2 = normalize(vec2(cos(0.785398 - halfSpread), sin(0.785398 - halfSpread)));',
    '  vec4 rays1 = vec4(iRayColor1, 1.0) * rayStrength(rayPos, rayRefDir1, tiltedCoord, 36.2214, 21.11349, iSpeed);',
    '  vec4 rays2 = vec4(iRayColor2, 1.0) * rayStrength(rayPos, rayRefDir2, tiltedCoord, 22.3991, 18.0234, iSpeed * 0.2);',
    '  vec4 color = rays1 * (1.0 - iBlend) * 0.9 + rays2 * iBlend * 0.9;',
    '  float distanceToLight = length(fragCoord.xy - vec2(rayPos.x, iResolution.y - rayPos.y)) / iResolution.y;',
    '  float brightness = iIntensity * 0.4 / pow(max(distanceToLight, 0.001), iFalloff);',
    '  color.rgb *= brightness;',
    '  float gray = dot(color.rgb, vec3(0.299, 0.587, 0.114));',
    '  color.rgb = mix(vec3(gray), color.rgb, iSaturation);',
    '  color.a = max(color.r, max(color.g, color.b)) * iOpacity;',
    '  gl_FragColor = color;',
    '}'
  ].join('\n');

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    return sh;
  }
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vert));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(program);
  gl.useProgram(program);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(program, 'position');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
  const u = (n) => gl.getUniformLocation(program, n);
  gl.uniform3fv(u('iRayColor1'), hex('#EAB308'));
  gl.uniform3fv(u('iRayColor2'), hex('#96c8ff'));
  gl.uniform1f(u('iSpeed'), 2.5);
  gl.uniform1f(u('iIntensity'), 2);
  gl.uniform1f(u('iSpread'), 2);
  gl.uniform1f(u('iTilt'), 0);
  gl.uniform1f(u('iSaturation'), 1.5);
  gl.uniform1f(u('iBlend'), 0.75);
  gl.uniform1f(u('iFalloff'), 1.6);
  gl.uniform1f(u('iOpacity'), 1);

  let w = 0, h = 0, last = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = host.clientWidth; h = host.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(u('iResolution'), canvas.width, canvas.height);
  }
  function loop(time) {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    if (time - last < 33) return;   // 30fps 节流，同项目
    last = time;
    gl.uniform1f(u('iTime'), time * 0.001);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();

/* ============================== 启动 ============================== */
buildRail();
render();
startAuto();
setTimeout(updateReadout, 60);
</script>
