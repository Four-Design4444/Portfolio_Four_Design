<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo · 联系方式与经验卡片调换</title>
<link rel="stylesheet" href="/src/styles.css">
<style>
  /* ---- Demo-only overrides: swapped layout (contact above, experience
     composite below). Same model as the project page: ONE slot of constant
     height holds the stat row; both description cards are absolute and
     crossfade/expand INSIDE it — nothing below is ever reflowed, so the
     contact never moves and the skills strip never gets pushed. ---- */
  body { background: #050505; }

  /* The demo has no paged-scroll reveal host — force the entrance states on. */
  .pf-title, .pf-swap, .pf-skills-entrance { opacity: 1 !important; transform: none !important; transition: none !important; }

  /* Anchor the content block to its resting (mock) position instead of
     flex-centering: centering would re-center whenever a card expands and
     push the title/contact UP. Anchored, growth extends downward only. */
  .pf-inner { align-items: flex-start; overflow: hidden; }
  .pf-content { margin-top: clamp(200px, 26.85vh, 290px); }

  /* Sizes & spacing measured off 调换.jpg (1920×1080):
     title 84px @ y304 · title→contact 81 · contact 20px, line gap 42 ·
     contact→cards 92 · cards→skills 67. The strip's own dock offset
     (translateY 44 + margin 44) is compensated in the entrance margin. */
  .pf-title { gap: 40px; white-space: nowrap; }
  .pf-title-en { font-size: clamp(44px, 4.4vw, 84px); }
  .pf-title-cn { font-size: clamp(18px, 1.35vw, 26px); }

  /* The zone's hit area must cover BOTH layout states — at rest and with
     the slot grown — otherwise a cursor parked in the band between the
     rest strip bottom and the docked strip bottom flips the state every
     time Chrome recomputes hover after a layout change (the enter/leave
     loop at the last button's bottom-right corner). */
  .pf-hover-zone { min-height: calc(clamp(24px, 1.56vw, 30px) * 1.15 + 250px); }

  .pf-contact { margin-top: clamp(28px, 4.6vh, 50px); gap: clamp(14px, 2vh, 24px); }
  .pf-contact p { font-size: clamp(15px, 1.05vw, 20px); }

  .pf-swap {
    position: relative;
    min-height: calc(clamp(24px, 1.56vw, 30px) * 1.15 + 103px);
    margin-top: clamp(36px, 7.1vh, 78px);
    transition: min-height 480ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .pf-swap.has-skill { min-height: calc(clamp(24px, 1.56vw, 30px) * 1.15 + 170px); }

  .pf-statrow {
    position: absolute;
    top: 0;
    left: 0;
    /* Dock slides the row right by the mock's 16px (rest cards x148 →
       hover tabs x164), in sync with the description card below. */
    margin-left: 0;
    transition: margin-left 480ms cubic-bezier(0.22, 1, 0.36, 1), gap 480ms cubic-bezier(0.22, 1, 0.36, 1), opacity 300ms ease;
  }
  /* The docked TAB ROW staggers right of the description card (跟技能条错开
     信息卡一样): card stays put, its rounded top-left corner stays visible
     in the gap left of the indented tab row. */
  .pf-statrow.is-docked { margin-left: 16px; }

  .pf-stat { justify-content: flex-end; padding: 40px 12px 34px clamp(20px, 1.7vw, 32px); }

  /* Bounce fix: the collapsing number keeps its 10px bottom margin so the
     icon+label below never shift vertically when the selection changes. */
  .pf-statrow.is-docked .pf-stat:not(.is-active) strong { margin-bottom: 10px; }

    .pf-exp-card {
    position: absolute;
    top: calc(clamp(24px, 1.56vw, 30px) * 1.15 + 103px);
    left: 0;
    transform: none;
  }

  /* Skill card fills the slot (the slot grows to meet the docked strip).
     Bottom corners stay ROUNDED and visible — the strip dodges them by
     indenting right instead (see below). */
  .pf-skill-card {
    position: absolute;
    inset: 0;
    transform: none;
    max-height: none;
  }

  /* Strip sits right after the slot; its rest dock offset (44+44) is
     compensated so the visual cards→skills gap matches the mock. When a
     skill is hovered the margin collapses and the strip docks flush — and
     indents right by the card's corner radius so the card's rounded
     bottom-left corner stays visible (参考图2). */
  .pf-skills-entrance { margin-top: 10px; transition: margin-top 480ms cubic-bezier(0.22, 1, 0.36, 1); }
  .pf-skills-entrance.is-flush { margin-top: 0; }
  .pf-skills.has-active { margin-left: 16px; transition: margin-left 480ms cubic-bezier(0.22, 1, 0.36, 1); }
</style>
</head>
<body>
<div class="pf-inner">
  <div class="pf-bg" aria-hidden="true">
    <img class="pf-bg-img" src="/src/assets/profile/pc-portrait-bg.webp" alt="">
  </div>

  <div class="pf-content">
    <h2 class="pf-title">
      <span class="pf-title-en rany-display-heading">Hi , I Am Four</span>
      <span class="pf-title-cn">邱锋江</span>
    </h2>

    <!-- 调换后:联系方式上移,带完整的点击复制交互 -->
    <div class="pf-contact">
      <button type="button" class="pf-copy" data-label="手机号" data-value="18219315597">
        <span class="pf-copy-icon" aria-hidden="true">
          <svg class="pf-copy-ic-main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <svg class="pf-copy-ic-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </span>
        <span class="pf-copy-text">
          <span class="pf-copy-roller">
            <span class="pf-copy-stack">
              <span class="pf-copy-line">18219315597</span>
              <span class="pf-copy-line pf-copy-done">已复制手机号，欢迎联系</span>
            </span>
          </span>
          <i class="pf-copy-rule" aria-hidden="true"></i>
        </span>
        <span class="pf-copy-hint" aria-hidden="true">点击复制</span>
      </button>
      <button type="button" class="pf-copy" data-label="邮箱" data-value="Four4444.Design@gmail.com">
        <span class="pf-copy-icon" aria-hidden="true">
          <svg class="pf-copy-ic-main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <svg class="pf-copy-ic-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </span>
        <span class="pf-copy-text">
          <span class="pf-copy-roller">
            <span class="pf-copy-stack">
              <span class="pf-copy-line">Four4444.Design@gmail.com</span>
              <span class="pf-copy-line pf-copy-done">已复制邮箱，欢迎联系</span>
            </span>
          </span>
          <i class="pf-copy-rule" aria-hidden="true"></i>
        </span>
        <span class="pf-copy-hint" aria-hidden="true">点击复制</span>
      </button>
    </div>

    <div class="pf-hover-zone" id="zone">
      <div class="pf-swap" id="swap">
        <div class="pf-statrow" id="statrow">
          <button type="button" class="pf-stat" data-id="years">
            <strong>5+</strong>
            <span class="pf-stat-label"><img class="pf-stat-icon" src="/src/assets/profile/exp-years.svg" alt=""><span class="pf-stat-name">Years Design</span></span>
          </button>
          <button type="button" class="pf-stat" data-id="tools">
            <strong>10+</strong>
            <span class="pf-stat-label"><img class="pf-stat-icon" src="/src/assets/profile/exp-tools.svg" alt=""><span class="pf-stat-name">Design Tool</span></span>
          </button>
          <button type="button" class="pf-stat" data-id="cases">
            <strong>20+</strong>
            <span class="pf-stat-label"><img class="pf-stat-icon" src="/src/assets/profile/exp-cases.svg" alt=""><span class="pf-stat-name">Work Case</span></span>
          </button>
        </div>
        <div class="pf-exp-card" id="exp-card" aria-live="polite">
          <div class="pf-exp-card-body" id="exp-body"><p class="pf-exp-text"></p></div>
        </div>
        <div class="pf-skill-card" id="skill-card" aria-live="polite">
          <div class="pf-skill-card-body" id="skill-body"></div>
        </div>
      </div>

      <div class="pf-skills-entrance" id="skills-entrance">
        <div class="pf-skills" id="skills">
          <button type="button" class="pf-skill" data-id="figma"><img class="pf-skill-icon" src="/src/assets/profile/figma.webp" alt="Figma"><span class="pf-skill-name">Figma</span></button>
          <button type="button" class="pf-skill" data-id="comfyui"><img class="pf-skill-icon" src="/src/assets/profile/comfyui.webp" alt="Comfyui"><span class="pf-skill-name">Comfyui</span></button>
          <button type="button" class="pf-skill" data-id="blender"><img class="pf-skill-icon" src="/src/assets/profile/blender.webp" alt="Blender"><span class="pf-skill-name">Blender</span></button>
          <button type="button" class="pf-skill" data-id="codex"><img class="pf-skill-icon" src="/src/assets/profile/codex.webp" alt="Codex"><span class="pf-skill-name">Codex</span></button>
          <button type="button" class="pf-skill" data-id="photoshop"><img class="pf-skill-icon" src="/src/assets/profile/photoshop.webp" alt="Photoshop"><span class="pf-skill-name">Photoshop</span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const STATS = [
    { id: 'years', text: '5年设计经验，横跨UI/UX、平面设计、3D建模与AIGC。擅长从用户视角构建清晰流畅的界面体验，以版式与视觉语言传递内容情绪，具备从概念到落地的完整执行能力，持续探索技术与设计的融合，让创意更自由地实现。' },
    { id: 'tools', text: '十余项专业软件掌握，具备较强学习能力与跨领域能力，近年来持续探索AIGC与设计工作流的结合，让技术成为创意的加速器。以稳定的专业输出和跨领域的适应力，持续为品牌创造价值。' },
    { id: 'cases', text: '多项完整商业项目经验，曾为多家企业提供年度设计支持，在长期合作中保持稳定输出，成为品牌设计环节中可信赖的长期伙伴。' }
  ];
  const SKILLS = [
    { id: 'figma', title: 'UI Design', text: '使用 Figma 进行 UI/UX 设计、组件化设计系统搭建与交互原型制作，具备开发思维了解组件复用、自适应、状态闭环等概念，熟悉 Auto Layout、Variants、Variables，能高效完成从设计到开发的交付。' },
    { id: 'comfyui', title: 'AIGC Workflow', text: '熟悉 ComfyUI 节点式工作流搭建，能独立完成模型加载、LoRA 微调、ControlNet 条件控制与高清放大等流程，把 AI 生成能力稳定嵌入日常设计生产链。' },
    { id: 'blender', title: '3D Design', text: '掌握 Blender 建模、材质、灯光与渲染全流程，能完成产品可视化与三维动效制作，为品牌与界面提供更具空间感的表达。' },
    { id: 'codex', title: 'AI Coding', text: '借助 Codex 等 AI 编程工具参与前端实现，理解组件结构与交付逻辑，让设计方案在开发环节被高效、高保真地还原。' },
    { id: 'photoshop', title: 'Visual Design', text: '精通 Photoshop 图像处理与视觉合成，覆盖精修、调色、版式与物料延展，保障每一处视觉输出的完成度与一致性。' }
  ];

  const zone = document.getElementById('zone');
  const swap = document.getElementById('swap');
  const row = document.getElementById('statrow');
  const expCard = document.getElementById('exp-card');
  const skillCard = document.getElementById('skill-card');
  const entrance = document.getElementById('skills-entrance');
  const skills = document.getElementById('skills');
  const statButtons = [...row.querySelectorAll('.pf-stat')];
  const skillButtons = [...skills.querySelectorAll('.pf-skill')];
  // Remember the showing card's id: re-entering the SAME selection must not
  // rebuild its body (that would replay the fade — the "text flash" bug).
  let showingStatId = null;
  let showingSkillId = null;

  // Look the current body up by id on every swap — the element is replaced
  // each time, so a reference captured at load would go stale after the
  // first hover and the text would stop switching.
  function swapBody(id, build) {
    const old = document.getElementById(id);
    const fresh = build();
    old.replaceWith(fresh);
    return fresh;
  }

  function setStat(id) {
    if (id === showingStatId) return;
    showingStatId = id;
    showingSkillId = null;
    row.classList.add('is-docked');
    row.classList.remove('is-hidden');
    swap.classList.remove('has-skill');
    expCard.classList.add('is-visible');
    skillCard.classList.remove('is-visible');
    skills.classList.add('is-hidden');
    skills.classList.remove('has-active');
    entrance.classList.remove('is-flush');
    statButtons.forEach((b) => b.classList.toggle('is-active', b.dataset.id === id));
    const s = STATS.find((x) => x.id === id);
    swapBody('exp-body', () => {
      const fresh = document.createElement('div');
      fresh.className = 'pf-exp-card-body';
      fresh.id = 'exp-body';
      const p = document.createElement('p');
      p.className = 'pf-exp-text';
      p.textContent = s.text;
      fresh.appendChild(p);
      return fresh;
    });
  }

  function setSkill(id) {
    if (id === showingSkillId) return;
    showingSkillId = id;
    showingStatId = null;
    row.classList.add('is-hidden');
    swap.classList.add('has-skill');
    expCard.classList.remove('is-visible');
    skillCard.classList.add('is-visible');
    skills.classList.remove('is-hidden');
    skills.classList.add('has-active');
    entrance.classList.add('is-flush');
    statButtons.forEach((b) => b.classList.remove('is-active'));
    skillButtons.forEach((b) => b.classList.toggle('is-active', b.dataset.id === id));
    const s = SKILLS.find((x) => x.id === id);
    swapBody('skill-body', () => {
      const fresh = document.createElement('div');
      fresh.className = 'pf-skill-card-body';
      fresh.id = 'skill-body';
      const t = document.createElement('p');
      t.className = 'pf-skill-title';
      t.textContent = s.title;
      const p = document.createElement('p');
      p.className = 'pf-skill-text';
      p.textContent = s.text;
      fresh.appendChild(t);
      fresh.appendChild(p);
      return fresh;
    });
  }

  function reset() {
    showingStatId = null;
    showingSkillId = null;
    row.classList.remove('is-docked', 'is-hidden');
    swap.classList.remove('has-skill');
    expCard.classList.remove('is-visible');
    skillCard.classList.remove('is-visible');
    skills.classList.remove('has-active', 'is-hidden');
    entrance.classList.remove('is-flush');
    statButtons.forEach((b) => b.classList.remove('is-active'));
    skillButtons.forEach((b) => b.classList.remove('is-active'));
  }

  /* ---- Selection is driven by REAL pointer movement only — applies run
     inside the mousemove handler, so deliberate switches stay instant while
     buttons that the morph slides under a PARKED cursor can never steal the
     selection (Chrome fires mouseenter for those slides, but never a
     mousemove). A move must also travel >8px from the last accepted
     position, so a micro-drift while parking cannot re-target either.
     The leave side keeps its own guard: a leave within LEAVE_GRACE ms of
     the last accept is deferred and re-checked against the zone's real
     :hover before resetting. ---- */
  const LEAVE_GRACE = 300;
  let lastEnterAt = 0;
  let resetTimer = 0;
  let anchorPos = null;

  function applyIntent(intent) {
    lastEnterAt = performance.now();
    if (resetTimer) {
      clearTimeout(resetTimer);
      resetTimer = 0;
    }
    if (intent.type === 'stat') setStat(intent.id);
    else setSkill(intent.id);
  }

  function buttonIntent(target) {
    if (!target || !target.closest) return null;
    const skillBtn = target.closest('.pf-skill');
    if (skillBtn) return { type: 'skill', id: skillBtn.dataset.id };
    const statBtn = target.closest('.pf-stat');
    if (statBtn) return { type: 'stat', id: statBtn.dataset.id };
    return null;
  }

  zone.addEventListener('mousemove', (e) => {
    const intent = buttonIntent(e.target);
    if (!intent) return;
    if (anchorPos) {
      const dx = e.clientX - anchorPos.x;
      const dy = e.clientY - anchorPos.y;
      if (dx * dx + dy * dy < 64) return; // < 8px — parked drift, not a move
    }
    anchorPos = { x: e.clientX, y: e.clientY };
    applyIntent(intent);
  }, { passive: true });

  function onLeave() {
    anchorPos = null; // the next entry accepts a fresh position
    if (resetTimer) {
      clearTimeout(resetTimer);
      resetTimer = 0;
    }
    const wait = Math.max(0, LEAVE_GRACE - (performance.now() - lastEnterAt));
    if (wait <= 0) {
      reset();
      return;
    }
    resetTimer = setTimeout(() => {
      resetTimer = 0;
      // A transient leave during a morph must not kill a live hover — only
      // reset when the pointer is truly outside the zone now.
      if (!zone.matches(':hover')) reset();
    }, wait);
  }

  zone.addEventListener('mouseleave', onLeave);

  /* ---- Click-to-copy contact lines (ported from CopyContactLine) ---- */
  document.querySelectorAll('.pf-copy').forEach((btn) => {
    const roller = btn.querySelector('.pf-copy-roller');
    const main = btn.querySelector('.pf-copy-line');
    const done = btn.querySelector('.pf-copy-done');
    let timer = 0;

    const pin = (el) => { roller.style.width = el.getBoundingClientRect().width + 'px'; };
    const pinMain = () => pin(main);
    // Fonts and late layout can change the line's width after the first
    // paint — re-measure on each of those signals or the roller clips text.
    pinMain();
    requestAnimationFrame(pinMain);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(pinMain));
    window.addEventListener('load', pinMain);
    window.addEventListener('resize', pinMain);

    btn.addEventListener('click', async () => {
      const value = btn.dataset.value;
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = value;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      clearTimeout(timer);
      pin(done);
      btn.classList.add('is-copied');
      timer = setTimeout(() => {
        pinMain();
        btn.classList.remove('is-copied');
      }, 2600);
    });
  });
</script>
</body>
</html>
