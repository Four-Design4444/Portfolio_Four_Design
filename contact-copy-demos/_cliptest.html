<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>clip test</title>
<style>
  body{background:#0d0c12;color:#fff;font-size:30px;padding:40px}
  .wrap{overflow:hidden;height:1.35em;position:relative;display:inline-block;vertical-align:middle;white-space:nowrap}
  .l1{display:block;height:1.35em}
  .l2{display:block;height:1.35em;position:absolute;inset:0;transform:translateY(105%);color:#96c8ff}
  .shift .l1{transform:translateY(-105%)}
  .shift .l2{transform:translateY(0)}
</style>
</head>
<body>
<div><button class="wrap" id="a"><span class="l1">182 1931 5597</span><span class="l2">已复制手机号,欢迎联系</span></button></div>
<div style="height:20px"></div>
<div><span class="wrap" id="b"><span class="l1">182 1931 5597</span><span class="l2">已复制手机号,欢迎联系</span></span></div>
<div style="height:20px"></div>
<div><button class="wrap shift" id="c"><span class="l1">182 1931 5597</span><span class="l2">已复制手机号,欢迎联系</span></button></div>
<div style="height:20px"></div>
<div><span class="wrap shift" id="d"><span class="l1">182 1931 5597</span><span class="l2">已复制手机号,欢迎联系</span></span></div>
</body>
</html>
