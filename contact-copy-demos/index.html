<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>联系方式复制交互 · 4 个方向</title>
<style>
  :root{--bg:#0d0c12;--ink:#f5f5f7;--dim:#9a97a3;--blue:#005df5;--ease:cubic-bezier(0.22,1,0.36,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:"Rany Display","Segoe UI",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
  h2{font-size:15px;font-weight:400;letter-spacing:.3em;color:var(--dim)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  a{
    display:block;padding:34px 44px;border:1px solid #26242e;color:var(--ink);
    text-decoration:none;font-size:22px;position:relative;overflow:hidden;
    transition:border-color .5s var(--ease),transform .5s var(--ease);
  }
  a .n{display:block;font-size:11px;letter-spacing:.28em;color:var(--blue);margin-bottom:10px}
  a:hover{border-color:var(--blue);transform:translateY(-3px)}
  a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--blue);
    transform:scaleX(0);transform-origin:left;transition:transform .55s var(--ease)}
  a:hover::after{transform:scaleX(1)}
</style>
</head>
<body>
<h2>联系方式复制交互 · 4 DEMOS</h2>
<div class="grid">
  <a href="demo1-roll.html"><span class="n">DEMO 1</span>纵向翻滚 Roll Swap</a>
  <a href="demo2-scramble.html"><span class="n">DEMO 2</span>乱码解码 Scramble</a>
  <a href="demo3-sweep.html"><span class="n">DEMO 3</span>蓝色扫幕 Sweep</a>
  <a href="demo4-stagger.html"><span class="n">DEMO 4</span>逐字飞散 Char Stagger</a>
</div>
</body>
</html>
